      const [orders, setOrders] = useState(INITIAL_ORDERS);
      const [finance, setFinance] = useState(() => generateInitialFinance());
      const [toasts, setToasts] = useState([]);
      const [customLogo, setCustomLogo] = useState(null);
      const [customQrImage, setCustomQrImage] = useState(null);
      const [paymentInfoText, setPaymentInfoText] = useState('Payment : LinkAja 08111110709 - BNI 0332812154');

      // Real-Time Cloud Sync State
      const [sdkReady, setSdkReady] = useState(Boolean(window.SpatwoFirebaseSDK));
      const [manualCloudConfig, setManualCloudConfig] = useState(null);
      const [cloudStatus, setCloudStatus] = useState('offline'); // 'offline' | 'connecting' | 'connected'
      const [cloudUser, setCloudUser] = useState(null);
      const dbRef = useRef(null);

      const workspaceAppId = typeof __app_id !== 'undefined' ? __app_id : 'spatwo-enterprise-live';

      const activeFirebaseConfig = useMemo(() => {
        if (manualCloudConfig) return manualCloudConfig;
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          try {
            return JSON.parse(__firebase_config);
          } catch (e) {
            return null;
          }
        }
        return DEFAULT_CLOUD_CONFIG;
      }, [manualCloudConfig]);

      useEffect(() => {
        if (window.SpatwoFirebaseSDK) {
          setSdkReady(true);
          return;
        }
        const onReady = () => setSdkReady(true);
        window.addEventListener('spatwo-firebase-ready', onReady);
        return () => window.removeEventListener('spatwo-firebase-ready', onReady);
      }, []);

      const addToast = (title, message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, title, message, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 5500);
      };

      // Step 1: Initialize Firebase & Authenticate BEFORE any Firestore query (RULE 3)
      useEffect(() => {
        if (!sdkReady || !activeFirebaseConfig) return;
        let unsubAuth = () => {};
        let cancelled = false;

        const initAuth = async () => {
          try {
            setCloudStatus('connecting');
            const sdk = window.SpatwoFirebaseSDK;
            const existingApps = sdk.getApps();
            const appInstance = existingApps.length > 0 ? existingApps[0] : sdk.initializeApp(activeFirebaseConfig);
            const auth = sdk.getAuth(appInstance);
            const db = sdk.getFirestore(appInstance);
            dbRef.current = db;

            unsubAuth = sdk.onAuthStateChanged(auth, (user) => {
              if (!cancelled && user) {
                setCloudUser(user);
                setCloudStatus('connected');
              }
            });

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await sdk.signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await sdk.signInAnonymously(auth);
            }
          } catch (err) {
            if (!cancelled) {
              setCloudStatus('offline');
              addToast('Koneksi Cloud Gagal', 'Periksa konfigurasi Firebase / izin Anonymous Auth.', 'warn');
            }
          }
        };

        initAuth();
        return () => {
          cancelled = true;
          unsubAuth();
        };
      }, [sdkReady, activeFirebaseConfig]);

      // Step 2: Subscribe to Real-Time Public Workspace Collections (RULE 1 & RULE 2)
      useEffect(() => {
        if (!cloudUser || !dbRef.current || !window.SpatwoFirebaseSDK) return;
        const sdk = window.SpatwoFirebaseSDK;
        const db = dbRef.current;

        const ordersCol = sdk.collection(db, 'artifacts', workspaceAppId, 'public', 'data', 'orders');
        const customersCol = sdk.collection(db, 'artifacts', workspaceAppId, 'public', 'data', 'customers');
        const financeCol = sdk.collection(db, 'artifacts', workspaceAppId, 'public', 'data', 'finance');
        const inventoryCol = sdk.collection(db, 'artifacts', workspaceAppId, 'public', 'data', 'inventory');
        const brandingDoc = sdk.doc(db, 'artifacts', workspaceAppId, 'public', 'data', 'settings', 'branding');

        const unsubOrders = sdk.onSnapshot(
          ordersCol,
          (snap) => {
            if (!snap.empty) {
              const list = snap.docs
                .map((d) => d.data())
                .sort((a, b) => String(b.dateIn || '').localeCompare(String(a.dateIn || '')));
              setOrders(list);
            }
          },
          (err) => console.error('Orders snapshot error:', err)
        );

        const unsubCustomers = sdk.onSnapshot(
          customersCol,
          (snap) => {
            if (!snap.empty) {
              const list = snap.docs
                .map((d) => d.data())
                .sort((a, b) => (Number(b.totalSpend) || 0) - (Number(a.totalSpend) || 0));
              setCustomers(list);
            }
          },
          (err) => console.error('Customers snapshot error:', err)
        );

        const unsubFinance = sdk.onSnapshot(
          financeCol,
          (snap) => {
            if (!snap.empty) {
              const list = snap.docs
                .map((d) => d.data())
                .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
              setFinance(list);
            }
          },
          (err) => console.error('Finance snapshot error:', err)
        );

        const unsubInventory = sdk.onSnapshot(
          inventoryCol,
          (snap) => {
            if (!snap.empty) {
              setInventory(snap.docs.map((d) => d.data()));
            }
          },
          (err) => console.error('Inventory snapshot error:', err)
        );

        const unsubBranding = sdk.onSnapshot(
          brandingDoc,
          (snap) => {
            if (snap.exists()) {
              const data = snap.data();
              if (data.paymentInfoText) setPaymentInfoText(data.paymentInfoText);
              if (data.customLogo !== undefined) setCustomLogo(data.customLogo);
              if (data.customQrImage !== undefined) setCustomQrImage(data.customQrImage);
            }
          },
          (err) => console.error('Branding snapshot error:', err)
        );

        return () => {
          unsubOrders();
          unsubCustomers();
          unsubFinance();
          unsubInventory();
          unsubBranding();
        };
      }, [cloudUser, workspaceAppId]);

      const syncDocToCloud = async (collectionName, docId, payload) => {
        if (!cloudUser || !dbRef.current || !window.SpatwoFirebaseSDK) return;
        try {
          const sdk = window.SpatwoFirebaseSDK;
          // Strip large base64 photos if over 800KB to stay safely within 1MB document limit
          const safePayload = { ...payload };
          if (safePayload.photo && safePayload.photo.length > 750000) delete safePayload.photo;
          if (safePayload.afterPhoto && safePayload.afterPhoto.length > 750000) delete safePayload.afterPhoto;
          const ref = sdk.doc(dbRef.current, 'artifacts', workspaceAppId, 'public', 'data', collectionName, String(docId));
          await sdk.setDoc(ref, safePayload, { merge: true });
        } catch (err) {
          console.error(`Cloud sync error (${collectionName}/${docId}):`, err);
        }
      };

      const handleSeedCloudMasterData = async () => {
        if (!cloudUser || !dbRef.current || !window.SpatwoFirebaseSDK) {
          addToast('Cloud Belum Terhubung', 'Hubungkan konfigurasi cloud terlebih dahulu.', 'warn');
          return;
        }
        try {
          const sdk = window.SpatwoFirebaseSDK;
          const db = dbRef.current;
          const batch = sdk.writeBatch(db);

          orders.forEach((ord) => {
            const ref = sdk.doc(db, 'artifacts', workspaceAppId, 'public', 'data', 'orders', ord.id);
            batch.set(ref, ord);
          });
          customers.forEach((cust) => {
            const ref = sdk.doc(db, 'artifacts', workspaceAppId, 'public', 'data', 'customers', cust.id);
            batch.set(ref, cust);
          });
          finance.forEach((tx) => {
            const ref = sdk.doc(db, 'artifacts', workspaceAppId, 'public', 'data', 'finance', tx.id);
            batch.set(ref, tx);
          });
          inventory.forEach((inv) => {
            const ref = sdk.doc(db, 'artifacts', workspaceAppId, 'public', 'data', 'inventory', inv.id);
            batch.set(ref, inv);
          });

          await batch.commit();
          addToast('Sinkronisasi Master Berhasil', `${orders.length} order & ${customers.length} member sudah tersimpan di Cloud!`);
        } catch (err) {
          addToast('Gagal Upload Master', 'Terjadi kendala saat mengunggah batch data ke cloud.', 'warn');
        }
      };

      const handleUpdateLogo = (val) => {
        setCustomLogo(val);
        syncDocToCloud('settings', 'branding', { customLogo: val || null });
      };

      const handleUpdateQrImage = (val) => {
        setCustomQrImage(val);
        syncDocToCloud('settings', 'branding', { customQrImage: val || null });
      };

      const handleUpdatePaymentText = (val) => {
        setPaymentInfoText(val);
        syncDocToCloud('settings', 'branding', { paymentInfoText: val });
      };

      const menuItems = useMemo(() => {
        const all = [
          { id: 'dashboard', label: 'Dashboard Utama', icon: 'layout-dashboard', roles: ['owner'] },
          { id: 'pos', label: 'Order / POS Kasir', icon: 'plus-circle', roles: ['owner', 'kasir'] },
          { id: 'tracking', label: 'Tracking & Status', icon: 'kanban', roles: ['owner', 'kasir', 'staff', 'kurir'] },
          { id: 'customers', label: 'Customer & Loyalty', icon: 'users', roles: ['owner', 'kasir'] },
          { id: 'finance', label: 'Keuangan & Laba Rugi', icon: 'wallet', roles: ['owner'] },
          { id: 'inventory', label: 'Inventory Bahan', icon: 'package', roles: ['owner', 'kasir', 'staff'] },
          { id: 'employees', label: 'Karyawan & Kinerja', icon: 'award', roles: ['owner'] },
          { id: 'settings', label: 'Cabang & Setting', icon: 'settings', roles: ['owner'] },
        ];
        return all.filter((m) => m.roles.includes(role));
      }, [role]);

      useEffect(() => {
        if (!menuItems.some((m) => m.id === activeMenu)) {
          setActiveMenu(menuItems[0]?.id || 'tracking');
        }
      }, [role, menuItems, activeMenu]);

      const handleCreateOrder = (newOrder) => {
        setOrders((prev) => [newOrder, ...prev]);
        syncDocToCloud('orders', newOrder.id, newOrder);

        const newFinanceTx = {
          id: `FIN-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          date: newOrder.dateIn,
          type: 'INCOME',
          category: 'Pendapatan Cuci Sepatu',
          description: `${newOrder.id} • ${newOrder.customerName} (${newOrder.shoeBrand})`,
          branchId: newOrder.branchId,
          amount: newOrder.total,
        };
        setFinance((prev) => [newFinanceTx, ...prev]);
        syncDocToCloud('finance', newFinanceTx.id, newFinanceTx);

        setCustomers((prev) => {
          const existing = prev.find((c) => c.name.toLowerCase() === newOrder.customerName.toLowerCase());
          if (existing) {
            const newWashes = existing.totalWashes + 1;
            const newSpend = existing.totalSpend + newOrder.total;
            const newTier = newWashes >= 12 ? 'VIP' : newWashes >= 6 ? 'Gold' : newWashes >= 3 ? 'Silver' : 'Regular';
            const updatedCust = { ...existing, totalWashes: newWashes, totalSpend: newSpend, lastWash: newOrder.dateIn, tier: newTier };
            syncDocToCloud('customers', updatedCust.id, updatedCust);
            return prev.map((c) => (c.id === existing.id ? updatedCust : c));
          }
          const newCust = {
            id: `CUST-${Date.now()}`,
            name: newOrder.customerName,
            phone: newOrder.customerPhone,
            branchId: newOrder.branchId,
            totalWashes: 1,
            totalSpend: newOrder.total,
            lastWash: newOrder.dateIn,
            tier: 'Regular',
          };
          syncDocToCloud('customers', newCust.id, newCust);
          return [newCust, ...prev];
        });
      };

      const handleSetStatus = (orderId, targetStatus) => {
        setOrders((prev) =>
          prev.map((o) => {
            if (o.id !== orderId) return o;
            if (targetStatus === 'QC & Siap Diambil' && o.status !== 'QC & Siap Diambil') {
              const waMsg = `Halo ${o.customerName}, sepatu *${o.shoeBrand}* kamu sudah lolos QC dan siap diambil di *SPATWO — Fresh Step Daily* (${o.id}). Terima kasih!`;
              openWhatsAppMessage(o.customerPhone, waMsg);
              addToast('Notifikasi WA Siap Diambil', `Chat WhatsApp untuk ${o.customerName} dibuka otomatis.`, 'wa');
              setInventory((inv) =>
                inv.map((item) => {
                  if (item.id !== 'INV-1') return item;
                  const updatedInv = { ...item, stock: Math.max(0, item.stock - 1) };
                  syncDocToCloud('inventory', updatedInv.id, updatedInv);
                  return updatedInv;
                })
              );
            }
            const updatedOrder = { ...o, status: targetStatus };
            syncDocToCloud('orders', updatedOrder.id, updatedOrder);
            return updatedOrder;
          })
        );
      };

      const handleAdvanceStatus = (orderId) => {
        const found = orders.find((o) => o.id === orderId);
        if (!found) return;
        const idx = STATUS_FLOW.indexOf(found.status);
        if (idx >= 0 && idx < STATUS_FLOW.length - 1) {
          handleSetStatus(orderId, STATUS_FLOW[idx + 1]);
        }
      };

      const handleScanAdvance = (code) => {
        const found = orders.find((o) => o.id.toUpperCase() === code);
        if (!found) {
          addToast('Barcode Tidak Ditemukan', `No Order "${code}" tidak terdaftar.`, 'warn');
          return;
        }
        handleAdvanceStatus(found.id);
        addToast('Status Diperbarui', `${found.id} (${found.shoeBrand}) maju ke tahap berikutnya.`);
      };

      const handleAttachAfterPhoto = (orderId, dataUrl) => {
        setOrders((prev) =>
          prev.map((o) => {
            if (o.id !== orderId) return o;
            const updated = { ...o, afterPhoto: dataUrl };
            syncDocToCloud('orders', updated.id, updated);
            return updated;
          })
        );
        addToast('Foto After QC Tersimpan', `Bukti foto hasil akhir untuk ${orderId} berhasil dilampirkan.`);
      };

      const handleImportData = (payload, mode) => {
        const incomingOrders = payload.orders || [];
        if (mode === 'replace') {
          setOrders(incomingOrders);
          incomingOrders.forEach((ord) => syncDocToCloud('orders', ord.id, ord));
          if (Array.isArray(payload.customers) && payload.customers.length > 0) {
            setCustomers(payload.customers);
            payload.customers.forEach((c) => syncDocToCloud('customers', c.id, c));
          }
          if (Array.isArray(payload.finance) && payload.finance.length > 0) {
            setFinance(payload.finance);
            payload.finance.forEach((f) => syncDocToCloud('finance', f.id, f));
          } else {
            const rebuiltIncome = incomingOrders
              .filter((o) => o.total > 0)
              .map((o, idx) => ({
                id: `FIN-IMP-${idx + 1}`,
                date: o.dateIn,
                type: 'INCOME',
                category: 'Pendapatan Cuci Sepatu',
                description: `${o.id} • ${o.customerName} (${o.shoeBrand})`,
                branchId: o.branchId,
                amount: o.total,
              }));
            setFinance((prev) => [
              ...rebuiltIncome,
              ...prev.filter((tx) => tx.type === 'EXPENSE'),
            ]);
          }
          addToast(
            'Replace Data Berhasil',
            `${incomingOrders.length} data sepatu berhasil dimuat & disinkronkan.`
          );
          return;
        }

        // Merge mode: update existing orders by ID & prepend newly added ones
        const incomingMap = new Map(incomingOrders.map((o) => [o.id, o]));
        const updatedExisting = orders.map((existing) => {
          if (!incomingMap.has(existing.id)) return existing;
          const merged = { ...existing, ...incomingMap.get(existing.id) };
          syncDocToCloud('orders', merged.id, merged);
          return merged;
        });
        const existingIds = new Set(orders.map((o) => o.id));
        const brandNewOrders = incomingOrders.filter((o) => !existingIds.has(o.id));
        brandNewOrders.forEach((ord) => syncDocToCloud('orders', ord.id, ord));
        setOrders([...brandNewOrders, ...updatedExisting]);

        if (Array.isArray(payload.customers) && payload.customers.length > 0) {
          setCustomers((prev) => {
            const map = new Map(prev.map((c) => [c.name.toLowerCase(), c]));
            payload.customers.forEach((inc) => {
              const key = inc.name.toLowerCase();
              const cur = map.get(key);
              if (!cur) {
                map.set(key, inc);
                syncDocToCloud('customers', inc.id, inc);
              } else {
                const mergedCust = {
                  ...cur,
                  ...inc,
                  totalWashes: Math.max(cur.totalWashes || 0, inc.totalWashes || 0),
                  totalSpend: Math.max(cur.totalSpend || 0, inc.totalSpend || 0),
                  lastWash: (inc.lastWash || '') > (cur.lastWash || '') ? inc.lastWash : cur.lastWash,
                };
                map.set(key, mergedCust);
                syncDocToCloud('customers', mergedCust.id, mergedCust);
              }
            });
            return Array.from(map.values());
          });
        }

        if (brandNewOrders.length > 0) {
          setFinance((prev) => {
            const newTx = brandNewOrders
              .filter((o) => o.total > 0)
              .map((o, idx) => {
                const tx = {
                  id: `FIN-SYNC-${Date.now()}-${idx}`,
                  date: o.dateIn,
                  type: 'INCOME',
                  category: 'Pendapatan Cuci Sepatu',
                  description: `${o.id} • ${o.customerName} (${o.shoeBrand})`,
                  branchId: o.branchId,
                  amount: o.total,
                };
                syncDocToCloud('finance', tx.id, tx);
                return tx;
              });
            return [...newTx, ...prev];
          });
        }

        addToast(
          'Sinkronisasi Merge Selesai',
          `${payload.newCount} order baru ditambahkan & ${payload.statusChangedCount} status diperbarui.`
        );
      };

      const activeMenuObj = menuItems.find((m) => m.id === activeMenu) || menuItems[0];

      return (
        <div className="min-h-screen flex bg-slate-50">
          {/* Desktop Sidebar */}
          <aside className="hidden lg:flex lg:flex-col lg:w-64 lg:fixed lg:inset-y-0 bg-white border-r border-slate-200/80 z-30">
            <div className="p-5 flex items-center gap-3 border-b border-slate-100">
              <BrandEmblem size={42} customLogo={customLogo} />
              <div className="min-w-0">
                <h1 className="font-display font-extrabold text-base tracking-tight text-slate-900 leading-none truncate">
                  SPATWO
                </h1>
                <p className="text-[11px] font-medium text-tosca-600 mt-1 truncate">Fresh Step Daily</p>
              </div>
            </div>

            <nav className="flex-1 p-3 space-y-1 overflow-y-auto">
              {menuItems.map((item) => {
                const active = activeMenu === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveMenu(item.id)}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      active
                        ? 'bg-slate-900 text-white shadow-xs'
                        : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                    }`}
                  >
                    <Icon name={item.icon} size={17} className={active ? 'text-tosca-400' : 'text-slate-400'} />
                    <span>{item.label}</span>
                  </button>
                );
              })}
            </nav>

            {/* Sidebar Footer: Role Switcher Profile */}
            <div className="p-4 border-t border-slate-100 space-y-3">
              <div className="bg-slate-900 text-white p-3 rounded-xl space-y-1.5">
                <div className="flex items-center gap-2 text-[11px] text-tosca-300 font-semibold">
                  <Icon name="shield-check" size={14} />
                  <span>Simulasi Hak Akses</span>
                </div>
                <select
                  value={role}
                  onChange={(e) => setRole(e.target.value)}
                  className="w-full bg-slate-800 text-white text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-slate-700 focus:outline-none cursor-pointer"
                >
                  <option value="owner">Owner / Super Admin</option>
                  <option value="kasir">Admin Cabang / Kasir</option>
                  <option value="staff">Staff Cuci</option>
                  <option value="kurir">Kurir / Driver</option>
                </select>
              </div>
              <div className="bg-tosca-50/80 px-3 py-2 rounded-xl border border-tosca-100 text-[11px] flex items-center justify-between">
                <button
                  type="button"
                  onClick={() => role === 'owner' && setActiveMenu('settings')}
                  className="flex items-center gap-1.5 font-bold text-tosca-900"
                >
                  <span className={`w-2 h-2 rounded-full ${cloudStatus === 'connected' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`} />
                  <span>{cloudStatus === 'connected' ? 'Cloud Sync Live' : 'Mode Lokal'}</span>
                </button>
                <span className="text-tosca-700 font-semibold">{orders.length} Item</span>
              </div>
            </div>
          </aside>

          {/* Mobile Drawer */}
          {mobileMenuOpen && (
            <div className="fixed inset-0 z-50 lg:hidden flex">
              <div className="fixed inset-0 bg-slate-900/50" onClick={() => setMobileMenuOpen(false)} />
              <div className="relative w-64 max-w-xs bg-white h-full p-4 flex flex-col z-10">
                <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                  <div className="flex items-center gap-2.5">
                    <BrandEmblem size={36} customLogo={customLogo} />
                    <div>
                      <p className="font-bold text-sm text-slate-900">SPATWO</p>
                      <p className="text-[10px] text-tosca-600 font-medium">Fresh Step Daily</p>
                    </div>
                  </div>
                  <button onClick={() => setMobileMenuOpen(false)} className="p-1.5 rounded-lg hover:bg-slate-100">
                    <Icon name="x" size={18} />
                  </button>
                </div>
                <nav className="flex-1 py-3 space-y-1">
                  {menuItems.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => {
                        setActiveMenu(item.id);
                        setMobileMenuOpen(false);
                      }}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold ${
                        activeMenu === item.id ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      <Icon name={item.icon} size={16} />
                      <span>{item.label}</span>
                    </button>
                  ))}
                </nav>
                <div className="pt-3 border-t border-slate-100">
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Ganti Role Akses</label>
                  <select
                    value={role}
                    onChange={(e) => {
                      setRole(e.target.value);
                      setMobileMenuOpen(false);
                    }}
                    className="w-full bg-slate-900 text-white text-xs font-semibold px-3 py-2 rounded-xl"
                  >
                    <option value="owner">Owner / Super Admin</option>
                    <option value="kasir">Admin Cabang / Kasir</option>
                    <option value="staff">Staff Cuci</option>
                    <option value="kurir">Kurir / Driver</option>
                  </select>
                </div>
              </div>
            </div>
          )}

          {/* Main Workspace */}
          <div className="flex-1 lg:pl-64 flex flex-col min-w-0">
            {/* Clean Top Header Bar */}
            <header className="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 sm:px-6 py-3.5">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setMobileMenuOpen(true)}
                    className="lg:hidden p-2 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50"
                  >
                    <Icon name="menu" size={18} />
                  </button>
                  <div>
                    <h2 className="font-bold text-slate-900 text-base sm:text-lg leading-tight">
                      {activeMenuObj?.label}
                    </h2>
                    <p className="text-[11px] text-slate-500">
                      Rabu, 25 November 2026 • SPATWO — Fresh Step Daily
                    </p>
                  </div>
                </div>

                {/* Quick Period Presets, Date Range & Branch Selector */}
                <div className="flex flex-wrap items-center gap-2">
                  <div className="hidden sm:flex items-center bg-slate-100 p-1 rounded-xl text-[11px] font-semibold">
                    {[
                      { label: 'Semua', start: '', end: '' },
                      { label: 'Bulan Ini', start: '2026-11-01', end: '2026-11-30' },
                      { label: 'Bulan Lalu', start: '2026-10-01', end: '2026-10-31' },
                      { label: 'Kuartal Ini', start: '2026-09-01', end: '2026-11-30' },
                    ].map((preset) => {
                      const isActive = dateRange.start === preset.start && dateRange.end === preset.end;
                      return (
                        <button
                          key={preset.label}
                          onClick={() => setDateRange({ start: preset.start, end: preset.end })}
                          className={`px-2.5 py-1 rounded-lg transition-all ${
                            isActive ? 'bg-white text-tosca-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          {preset.label}
                        </button>
                      );
                    })}
                  </div>

                  <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs">
                    <Icon name="calendar" size={13} className="text-tosca-600" />
                    <input
                      type="date"
                      value={dateRange.start}
                      onChange={(e) => setDateRange((prev) => ({ ...prev, start: e.target.value }))}
                      className="bg-transparent text-slate-700 focus:outline-none text-[11px]"
                      title="Dari Tanggal"
                    />
                    <span className="text-slate-400">-</span>
                    <input
                      type="date"
                      value={dateRange.end}
                      onChange={(e) => setDateRange((prev) => ({ ...prev, end: e.target.value }))}
                      className="bg-transparent text-slate-700 focus:outline-none text-[11px]"
                      title="Sampai Tanggal"
                    />
                    {(dateRange.start || dateRange.end) && (
                      <button
                        onClick={() => setDateRange({ start: '', end: '' })}
                        className="ml-1 text-[10px] font-bold text-rose-600 hover:underline"
                      >
                        Reset
                      </button>
                    )}
                  </div>

                  <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs">
                    <Icon name="map-pin" size={13} className="text-tosca-600" />
                    <select
                      value={selectedBranch}
                      onChange={(e) => setSelectedBranch(e.target.value)}
                      className="bg-transparent font-medium text-slate-700 focus:outline-none text-xs"
                    >
                      <option value="ALL">Semua Cabang ({branches.length})</option>
                      {branches.map((b) => (
                        <option key={b.id} value={b.id}>{b.name}</option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>
            </header>

            <main className="flex-1 p-4 sm:p-6 max-w-[1600px] w-full mx-auto">
              {activeMenu === 'dashboard' && (
                <DashboardPage
                  orders={orders}
                  customers={customers}
                  branches={branches}
                  finance={finance}
                  selectedBranch={selectedBranch}
                  dateRange={dateRange}
                  onNavigate={setActiveMenu}
                />
              )}
              {activeMenu === 'pos' && (
                <POSPage
                  orders={orders}
                  customers={customers}
                  services={services}
                  promos={promos}
                  branches={branches}
                  employees={employees}
                  selectedBranch={selectedBranch}
                  customLogo={customLogo}
                  customQrImage={customQrImage}
                  paymentInfoText={paymentInfoText}
                  onCreateOrder={handleCreateOrder}
                  onScanAdvance={handleScanAdvance}
                  addToast={addToast}
                />
              )}
              {activeMenu === 'tracking' && (
                <TrackingPage
                  orders={orders}
                  customers={customers}
                  finance={finance}
                  employees={employees}
                  selectedBranch={selectedBranch}
                  dateRange={dateRange}
                  role={role}
                  onAdvanceStatus={handleAdvanceStatus}
                  onSetStatus={handleSetStatus}
                  onAttachAfterPhoto={handleAttachAfterPhoto}
                  onImportData={handleImportData}
                  addToast={addToast}
                />
              )}
              {activeMenu === 'customers' && (
                <CustomersPage
                  customers={customers}
                  orders={orders}
                  selectedBranch={selectedBranch}
                  addToast={addToast}
                />
              )}
              {activeMenu === 'finance' && (
                <FinancePage
                  finance={finance}
                  branches={branches}
                  selectedBranch={selectedBranch}
                  dateRange={dateRange}
                  onAddExpense={(tx) => {
                    setFinance((prev) => [tx, ...prev]);
                    syncDocToCloud('finance', tx.id, tx);
                    addToast('Pengeluaran Dicatat', `${tx.description} (${formatRupiah(tx.amount)}) disimpan.`);
                  }}
                  addToast={addToast}
                />
              )}
              {activeMenu === 'inventory' && (
                <InventoryPage
                  inventory={inventory}
                  onAdjustStock={(id, delta) => {
                    setInventory((prev) =>
                      prev.map((i) => {
                        if (i.id !== id) return i;
                        const updated = { ...i, stock: Math.max(0, i.stock + delta) };
                        syncDocToCloud('inventory', updated.id, updated);
                        return updated;
                      })
                    );
                    addToast('Stok Diperbarui', 'Jumlah stok bahan berhasil disesuaikan.');
                  }}
                />
              )}
              {activeMenu === 'employees' && (
                <EmployeesPage
                  employees={employees}
                  branches={branches}
                  selectedBranch={selectedBranch}
                />
              )}
              {activeMenu === 'settings' && (
                <SettingsPage
                  branches={branches}
                  services={services}
                  promos={promos}
                  customLogo={customLogo}
                  customQrImage={customQrImage}
                  paymentInfoText={paymentInfoText}
                  cloudStatus={cloudStatus}
                  cloudUserId={cloudUser?.uid || ''}
                  workspaceAppId={workspaceAppId}
                  onConnectCloudConfig={(cfg) => {
                    setManualCloudConfig(cfg);
                    addToast('Menghubungkan Cloud...', 'Menginisialisasi sinkronisasi real-time antar perangkat.');
                  }}
                  onSeedCloudMasterData={handleSeedCloudMasterData}
                  onUpdateLogo={handleUpdateLogo}
                  onUpdateQrImage={handleUpdateQrImage}
                  onUpdatePaymentText={handleUpdatePaymentText}
                  onAddBranch={(b) => {
                    setBranches((prev) => [...prev, b]);
                    addToast('Cabang Ditambahkan', `${b.name} aktif di sistem.`);
                  }}
                  onUpdateServicePrice={(id, price) => {
                    setServices((prev) => prev.map((s) => (s.id === id ? { ...s, price } : s)));
                  }}
                  onTogglePromo={(id) => {
                    setPromos((prev) => prev.map((p) => (p.id === id ? { ...p, active: !p.active } : p)));
                  }}
                  addToast={addToast}
                />
              )}
            </main>
          </div>

          {/* Floating Toast Notification Stack */}
          <div className="fixed bottom-4 right-4 z-50 space-y-2 max-w-sm w-full pointer-events-none px-4 sm:px-0">
            {toasts.map((t) => (
              <div
                key={t.id}
                className="pointer-events-auto bg-slate-900 text-white p-3.5 rounded-2xl shadow-xl border border-slate-700/80 flex items-start gap-3"
              >
                <div className={`p-1.5 rounded-lg shrink-0 ${t.type === 'wa' ? 'bg-emerald-500/20 text-emerald-400' : t.type === 'warn' ? 'bg-amber-500/20 text-amber-400' : 'bg-tosca-500/20 text-tosca-400'}`}>
                  <Icon name={t.type === 'wa' ? 'message-circle' : t.type === 'warn' ? 'alert-triangle' : 'bell'} size={16} />
                </div>
                <div className="flex-1 min-w-0">
                  <p className="font-bold text-xs">{t.title}</p>
                  <p className="text-[11px] text-slate-300 mt-0.5 leading-relaxed">{t.message}</p>
                </div>
                <button
                  onClick={() => setToasts((prev) => prev.filter((item) => item.id !== t.id))}
                  className="text-slate-400 hover:text-white"
                >
                  <Icon name="x" size={14} />
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
