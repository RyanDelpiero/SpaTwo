      const num = Number(amount) || 0;
      return new Intl.NumberFormat('id-ID', {

      const digits = String(phone || '').replace(/\D/g, '');
      if (!digits) return '';
      if (digits.startsWith('6262')) return digits.slice(2);
      if (digits.startsWith('0')) return '62' + digits.slice(1);
      if (digits.startsWith('62')) return digits;
      return '62' + digits;
    };

      const formatted = formatWhatsAppPhone(phone);

          .split('-')
          .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
          .join('');
        const iconNode = window.lucide.icons[pascalName];
        if (!iconNode) return '';

          if (typeof window.lucide.createElement === 'function') {
            const el = window.lucide.createElement(iconNode);
            el.setAttribute('width', size);
            el.setAttribute('height', size);
            if (className) el.setAttribute('class', className);
            return el.outerHTML;
          }

            <div className="lg:col-span-7 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
              <div className="flex items-center justify-between mb-3">

            <div className="lg:col-span-5 bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">

                <p className="text-xs text-slate-500">Perbandingan volume sepatu &amp; omzet antar outlet</p>
              </div>
              <div className="divide-y divide-slate-100">
                {branchPerf.map((b) => (
                  <div key={b.id} className="p-4 flex items-center justify-between gap-3">
                    <div>
                      <p className="font-bold text-slate-900 text-xs">{b.name}</p>
                      <p className="text-[11px] text-slate-500 mt-0.5">
                        {b.totalOrders} Sepatu • Avg {b.avgHours} jam • ⭐ {b.rating}
                      </p>
                    </div>
                    <div className="text-right">
                      <p className="font-extrabold text-tosca-700 text-sm">{formatRupiah(b.revenue)}</p>
                      <span className="text-[10px] text-slate-400">Omzet Terkumpul</span>

      );
    };

    // =========================================================================
    // 4. HALAMAN ORDER / POS (POINT OF SALE — MULTI-SHOE CART + HD E-INVOICE)
    // =========================================================================
    const POSPage = ({
      orders,
      customers,
      services,
      promos,
      branches,
      employees,
      selectedBranch,
      customLogo,
      customQrImage,
      paymentInfoText,
      onCreateOrder,
      onScanAdvance,
      addToast,
    }) => {
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [branchId, setBranchId] = useState(selectedBranch === 'ALL' ? 'BR-JKS' : selectedBranch);
      const [shoeType, setShoeType] = useState('Sneakers');
      const [shoeBrand, setShoeBrand] = useState('');
      const [shoeColor, setShoeColor] = useState('');
      const [selectedServices, setSelectedServices] = useState(['Fast Clean']);
      const [photoPreview, setPhotoPreview] = useState(null);
      const [estDays, setEstDays] = useState(2);
      const [method, setMethod] = useState('Drop Off');
      const [paymentMethod, setPaymentMethod] = useState('QRIS');
      const [promoCode, setPromoCode] = useState('');
      const [staffId, setStaffId] = useState(employees.find((e) => e.role.includes('Staff') || e.role.includes('Technician'))?.id || 'EMP-1');
      const [notes, setNotes] = useState('');
      const [cartItems, setCartItems] = useState([]);
      const [latestReceipt, setLatestReceipt] = useState(null);
      const [scanInput, setScanInput] = useState('');

      useEffect(() => {
        if (selectedBranch !== 'ALL') setBranchId(selectedBranch);
      }, [selectedBranch]);

      const handleSelectExistingCustomer = (custId) => {
        const found = customers.find((c) => c.id === custId);
        if (found) {
          setCustomerName(found.name);
          setCustomerPhone(found.phone);
          setBranchId(found.branchId);
        }
      };

      const toggleService = (srvName) => {
        setSelectedServices((prev) =>
          prev.includes(srvName) ? prev.filter((s) => s !== srvName) : [...prev, srvName]
        );
      };

      const currentItemPrice = useMemo(() => {
        return selectedServices.reduce((sum, srvName) => {
          const found = services.find((s) => s.name === srvName);
          return sum + (found ? found.price : 0);
        }, 0);
      }, [selectedServices, services]);

      const subtotal = useMemo(() => {
        const cartSum = cartItems.reduce((sum, item) => sum + item.price, 0);
        const draftSum = shoeBrand.trim() ? currentItemPrice : 0;
        return cartSum + draftSum;
      }, [cartItems, shoeBrand, currentItemPrice]);

      const appliedPromo = useMemo(() => {
        if (!promoCode.trim()) return null;
        return promos.find((p) => p.active && p.code.toUpperCase() === promoCode.trim().toUpperCase()) || null;
      }, [promoCode, promos]);

      const discountAmount = useMemo(() => {
        if (!appliedPromo) return 0;
        if (appliedPromo.type === 'PERCENT') return Math.round((subtotal * appliedPromo.value) / 100);
        return Math.min(subtotal, appliedPromo.value);
      }, [appliedPromo, subtotal]);

      const grandTotal = Math.max(0, subtotal - discountAmount);

      const handleAddShoeToCart = () => {
        if (!shoeBrand.trim() || selectedServices.length === 0) {
          addToast('Lengkapi Data Sepatu', 'Isi merk sepatu & minimal 1 layanan sebelum menambah ke keranjang nota.', 'warn');
          return;
        }
        setCartItems((prev) => [
          ...prev,
          {
            id: Date.now() + Math.random(),
            shoeType,
            shoeBrand: shoeBrand.trim(),
            shoeColor: shoeColor.trim() || 'Standard',
            services: [...selectedServices],
            price: currentItemPrice,
            photo: photoPreview,
          },
        ]);
        setShoeBrand('');
        setShoeColor('');
        setPhotoPreview(null);
        addToast('Sepatu Ditambahkan ke Nota', `${shoeBrand.trim()} masuk ke daftar keranjang nota ini.`);
      };

      const handleRemoveCartItem = (itemId) => {
        setCartItems((prev) => prev.filter((item) => item.id !== itemId));
      };

      const handlePhotoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => setPhotoPreview(reader.result);
        reader.readAsDataURL(file);
      };

      // Generate High-Resolution E-Invoice PNG matching modern SPATWO template
      const generateReceiptCanvasBlob = async (ord) => {
        const branchName = branches.find((b) => b.id === ord.branchId)?.name || 'SPATWO';
        const custRecord = customers.find((c) => c.name.toLowerCase() === ord.customerName.toLowerCase());
        const washCount = custRecord ? custRecord.totalWashes : 1;
        const loyaltyProgress = washCount % 10 === 0 ? 10 : washCount % 10;
        const receiptItems = ord.items && ord.items.length > 0
          ? ord.items
          : [{ shoeBrand: ord.shoeBrand, shoeType: ord.shoeType, shoeColor: ord.shoeColor, services: ord.services, price: ord.total }];

        const extraItemsHeight = Math.max(0, receiptItems.length - 1) * 36;
        const scale = 2;
        const width = 640;
        const height = (customQrImage ? 1060 : 790) + extraItemsHeight;
        const canvas = document.createElement('canvas');
        canvas.width = width * scale;
        canvas.height = height * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);

        // Background
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);

        // Dark Modern Header
        ctx.fillStyle = '#0F172A';
        ctx.fillRect(0, 0, width, 114);

        // Brand Title & Outlet
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 26px sans-serif';
        ctx.fillText('SPATWO — Fresh Step Daily', 36, 52);
        ctx.fillStyle = '#2DD4BF';
        ctx.font = '600 15px sans-serif';
        ctx.fillText(branchName, 36, 82);

        // LUNAS Pill
        ctx.fillStyle = '#10B981';
        ctx.beginPath();
        ctx.roundRect(width - 146, 36, 110, 40, 12);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('LUNAS', width - 91, 61);
        ctx.textAlign = 'left';

        // Detail Rows
        let y = 160;
        const drawRow = (label, value, bold = false, color = '#0F172A') => {
          ctx.fillStyle = '#64748B';
          ctx.font = '16px sans-serif';
          ctx.fillText(label, 36, y);
          ctx.fillStyle = color;
          ctx.font = bold ? 'bold 16px sans-serif' : '16px sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(String(value), width - 36, y);
          ctx.textAlign = 'left';
          y += 38;
        };

        drawRow('No. Order', ord.id, true);
        drawRow('Customer', `${ord.customerName} (${ord.customerPhone})`);
        if (receiptItems.length === 1) {
          drawRow('Item Sepatu', `${receiptItems[0].shoeBrand} (${receiptItems[0].shoeType})`, true);
          drawRow('Layanan', receiptItems[0].services.join(', '), true, '#0D9488');
        } else {
          drawRow('Jumlah Item', `${receiptItems.length} Pasang Sepatu`, true, '#0D9488');
          receiptItems.forEach((it, i) => {
            ctx.fillStyle = '#0F172A';
            ctx.font = 'bold 15px sans-serif';
            ctx.fillText(`${i + 1}. ${it.shoeBrand} (${it.shoeType})`, 44, y);
            ctx.fillStyle = '#0D9488';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`${it.services.join(', ')} • ${formatRupiah(it.price)}`, width - 36, y);
            ctx.textAlign = 'left';
            y += 32;
          });
          y += 8;
        }
        drawRow('Metode / Bayar', `${ord.method} • ${ord.paymentMethod}`);
        drawRow('Estimasi Selesai', ord.estDone, true, '#0D9488');

        // Dashed Divider
        y += 6;
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(36, y);
        ctx.lineTo(width - 36, y);
        ctx.stroke();
        ctx.setLineDash([]);

        // Total Box
        y += 26;
        ctx.fillStyle = '#F8FAFC';
        ctx.beginPath();
        ctx.roundRect(36, y, width - 72, 64, 16);
        ctx.fill();
        ctx.fillStyle = '#0F172A';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('TOTAL PEMBAYARAN', 56, y + 38);
        ctx.fillStyle = '#0D9488';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(formatRupiah(ord.total), width - 56, y + 40);
        ctx.textAlign = 'left';

        // Loyalty Stamp Strip
        y += 84;
        ctx.fillStyle = '#F0FDFA';
        ctx.beginPath();
        ctx.roundRect(36, y, width - 72, 46, 12);
        ctx.fill();
        ctx.fillStyle = '#0F766E';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(
          `Progress Loyalty Stamp: ${loyaltyProgress}/10 Cuci • ${
            10 - loyaltyProgress === 0 ? 'Selamat! Gratis 1x Cuci Berikutnya!' : `${10 - loyaltyProgress}x lagi Gratis 1x Cuci`
          }`,
          width / 2,
          y + 28
        );

        // Payment Info & Optional QR LinkAja
        y += 74;
        ctx.fillStyle = '#0F172A';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText('INFORMASI PEMBAYARAN', width / 2, y);

        if (customQrImage) {
          y += 16;
          await new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
              const qrSize = 220;
              ctx.drawImage(img, (width - qrSize) / 2, y, qrSize, qrSize);
              y += qrSize + 24;
              resolve();
            };
            img.onerror = () => {
              y += 20;
              resolve();
            };
            img.src = customQrImage;
          });
        } else {
          y += 28;
        }

        ctx.fillStyle = '#0D9488';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(paymentInfoText, width / 2, y);

        y += 32;
        ctx.fillStyle = '#64748B';
        ctx.font = '14px sans-serif';
        ctx.fillText('Terima kasih telah mempercayakan sepatu Anda di SPATWO!', width / 2, y);

        // Barcode Footer
        y += 24;
        ctx.fillStyle = '#0F172A';
        let bx = (width - 240) / 2;
        for (let i = 0; i < 42; i++) {
          const bw = ((ord.id.charCodeAt(i % ord.id.length) + i * 5) % 3) + 1;
          ctx.fillRect(bx, y, bw, 28);
          bx += bw + 3;
        }
        ctx.font = '12px monospace';
        ctx.fillStyle = '#475569';
        ctx.fillText(ord.id, width / 2, y + 44);
        ctx.textAlign = 'left';

        return new Promise((resolve) => canvas.toBlob((blob) => resolve(blob), 'image/png'));
      };

      const handleSubmitOrder = (e) => {
        e.preventDefault();
        const combinedItems = [...cartItems];
        if (shoeBrand.trim() && selectedServices.length > 0) {
          combinedItems.push({
            id: Date.now(),
            shoeType,
            shoeBrand: shoeBrand.trim(),
            shoeColor: shoeColor.trim() || 'Standard',
            services: [...selectedServices],
            price: currentItemPrice,
            photo: photoPreview,
          });
        }

        if (!customerName.trim() || !customerPhone.trim() || combinedItems.length === 0) {
          addToast('Data Belum Lengkap', 'Harap isi nama customer, No WA, dan minimal 1 sepatu beserta layanannya.', 'warn');
          return;
        }

        const dateObj = new Date(TODAY_STR);
        dateObj.setDate(dateObj.getDate() + Number(estDays));
        const estDone = dateObj.toISOString().split('T')[0];

        const seq = String(orders.length + 117).padStart(3, '0');
        const baseOrderId = `SPW-${TODAY_STR.replace(/-/g, '')}-${seq}`;

        const rawSum = combinedItems.reduce((s, it) => s + it.price, 0) || 1;
        const createdOrders = combinedItems.map((item, idx) => {
          const itemNet = Math.max(0, Math.round(item.price - (item.price / rawSum) * discountAmount));
          return {
            id: combinedItems.length > 1 ? `${baseOrderId}-${idx + 1}` : baseOrderId,
            customerName: customerName.trim(),
            customerPhone: customerPhone.trim(),
            branchId,
            shoeType: item.shoeType,
            shoeBrand: item.shoeBrand,
            shoeColor: item.shoeColor,
            services: item.services,
            dateIn: TODAY_STR,
            estDone,
            status: 'Baru Masuk',
            staffId,
            method,
            paymentMethod,
            total: itemNet,
            photo: item.photo,
            notes: notes.trim() || (appliedPromo ? `Promo: ${appliedPromo.title}` : 'Order POS'),
          };
        });

        createdOrders.forEach((ord) => onCreateOrder(ord));

        const receiptObj = {
          ...createdOrders[0],
          id: baseOrderId,
          items: combinedItems,
          total: grandTotal,
        };
        setLatestReceipt(receiptObj);

        generateReceiptCanvasBlob(receiptObj).then(async (blob) => {
          if (blob && navigator.clipboard && window.ClipboardItem) {
            try {
              await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
              addToast(
                'E-Invoice Tersalin Otomatis!',
                `${combinedItems.length} pasang sepatu tersimpan. Klik "Kirim WA" lalu Tempel/Paste gambar struk di chat pelanggan.`,
                'wa'
              );
            } catch (err) {
              addToast('Order Berhasil Dibuat', `No Order ${baseOrderId} siap dikirim ke pelanggan.`);
            }
          } else {

        a.href = url;

    // =========================================================================
    // 5. HALAMAN TRACKING & STATUS (6-STAGE KANBAN + BEFORE/AFTER QC PHOTOS)
    // =========================================================================
    const TrackingPage = ({
      orders,
      employees,
      selectedBranch,
      dateRange,
      role,
      onAdvanceStatus,
      onSetStatus,
      onAttachAfterPhoto,
    }) => {
      const [viewMode, setViewMode] = useState('kanban');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [previewPhotoModal, setPreviewPhotoModal] = useState(null);

      const visibleOrders = useMemo(() => {
        return orders.filter((o) => {
          if (selectedBranch !== 'ALL' && o.branchId !== selectedBranch) return false;
          if (dateRange.start && o.dateIn < dateRange.start) return false;
          if (dateRange.end && o.dateIn > dateRange.end) return false;
          if (role === 'kurir' && o.method === 'Drop Off') return false;
          if (statusFilter !== 'ALL' && o.status !== statusFilter) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const match =
              o.id.toLowerCase().includes(q) ||
              o.customerName.toLowerCase().includes(q) ||
              o.shoeBrand.toLowerCase().includes(q);
            if (!match) return false;
          }
          return true;
        });
      }, [orders, selectedBranch, dateRange, role, statusFilter, searchQuery]);

      const handleDrop = (e, targetStatus) => {
        e.preventDefault();
        const orderId = e.dataTransfer.getData('text/plain');
        if (orderId) onSetStatus(orderId, targetStatus);
      };

      return (
        <div className="space-y-5">
          {/* Top Controls */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-2 flex-1 min-w-[240px]">
              <div className="relative flex-1 max-w-xs">
                <span className="absolute left-3 top-2.5 text-slate-400"><Icon name="search" size={14} /></span>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Cari No Order, customer, merk..."
                  className="w-full pl-8 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-tosca-600"
                />
              </div>
              <select
                value={statusFilter}
                onChange={(e) => setStatusFilter(e.target.value)}
                className="px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl font-medium text-slate-700"
              >
                <option value="ALL">Semua Status ({visibleOrders.length})</option>
                {STATUS_FLOW.map((st) => (
                  <option key={st} value={st}>{st}</option>
                ))}
              </select>
            </div>

            <div className="flex items-center bg-slate-100 p-1 rounded-xl text-xs font-semibold">
              <button
                onClick={() => setViewMode('kanban')}
                className={`px-3 py-1.5 rounded-lg inline-flex items-center gap-1.5 ${
                  viewMode === 'kanban' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'
                }`}
              >
                <Icon name="columns" size={14} /> Kanban
              </button>
              <button
                onClick={() => setViewMode('list')}
                className={`px-3 py-1.5 rounded-lg inline-flex items-center gap-1.5 ${
                  viewMode === 'list' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'
                }`}
              >
                <Icon name="list" size={14} /> List Table
              </button>
            </div>
          </div>

          {viewMode === 'kanban' ? (
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-6 gap-4 items-start">
              {STATUS_FLOW.map((stage) => {
                const stageOrders = visibleOrders.filter((o) => o.status === stage);
                return (
                  <div
                    key={stage}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={(e) => handleDrop(e, stage)}
                    className="bg-slate-100/80 p-3 rounded-2xl border border-slate-200/70 min-h-[260px] flex flex-col"
                  >
                    <div className="flex items-center justify-between px-1 pb-2.5 mb-2 border-b border-slate-200/80">
                      <span className="font-bold text-slate-800 text-xs">{stage}</span>
                      <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-white text-slate-700 shadow-2xs">
                        {stageOrders.length}
                      </span>
                    </div>

                    <div className="space-y-2.5 max-h-[560px] overflow-y-auto pr-0.5">
                      {stageOrders.length === 0 ? (
                        <div className="py-10 text-center text-[11px] text-slate-400 border border-dashed border-slate-200 rounded-xl">
                          Kosong / Drop ke sini
                        </div>
                      ) : (
                        stageOrders.map((ord) => {
                          const overdue = isOrderOverdue(ord);
                          const staffName = employees.find((e) => e.id === ord.staffId)?.name || 'Staff';
                          const currentIdx = STATUS_FLOW.indexOf(ord.status);
                          const nextStage = currentIdx < STATUS_FLOW.length - 1 ? STATUS_FLOW[currentIdx + 1] : null;

                          return (
                            <div
                              key={ord.id}
                              draggable
                              onDragStart={(e) => e.dataTransfer.setData('text/plain', ord.id)}
                              className={`bg-white p-3 rounded-xl border shadow-2xs space-y-2 cursor-grab active:cursor-grabbing ${
                                overdue ? 'border-rose-300 bg-rose-50/40' : 'border-slate-200/80'
                              }`}
                            >
                              <div className="flex items-center justify-between gap-1">
                                <span className="font-mono text-[10px] font-bold text-slate-500">{ord.id}</span>
                                {overdue && (
                                  <span className="px-1.5 py-0.5 rounded-md text-[9px] font-bold bg-rose-600 text-white">
                                    OVERDUE
                                  </span>
                                )}
                              </div>

                              <div>
                                <p className="font-bold text-slate-900 text-xs leading-snug">{ord.shoeBrand}</p>
                                <p className="text-[11px] text-slate-500">{ord.customerName} • {ord.dateIn}</p>
                              </div>

                              <div className="flex flex-wrap gap-1">
                                {ord.services.map((s) => (
                                  <span key={s} className="px-2 py-0.5 text-[10px] font-semibold bg-tosca-50 text-tosca-700 rounded-md">
                                    {s}
                                  </span>
                                ))}
                              </div>

                              {/* Before / After QC Photo Bar */}
                              <div className="flex items-center gap-1.5 pt-0.5">
                                {ord.photo && (
                                  <button
                                    type="button"
                                    onClick={() => setPreviewPhotoModal({ title: `Foto Before — ${ord.shoeBrand}`, src: ord.photo })}
                                    className="px-2 py-0.5 text-[10px] font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md inline-flex items-center gap-1"
                                  >
                                    <Icon name="image" size={10} /> Before
                                  </button>
                                )}
                                {ord.afterPhoto ? (
                                  <button
                                    type="button"
                                    onClick={() => setPreviewPhotoModal({ title: `Foto After QC — ${ord.shoeBrand}`, src: ord.afterPhoto })}
                                    className="px-2 py-0.5 text-[10px] font-semibold bg-emerald-100 hover:bg-emerald-200 text-emerald-800 rounded-md inline-flex items-center gap-1"
                                  >
                                    <Icon name="check-circle" size={10} /> After QC
                                  </button>
                                ) : (
                                  <label className="px-2 py-0.5 text-[10px] font-semibold bg-tosca-50 hover:bg-tosca-100 text-tosca-700 rounded-md inline-flex items-center gap-1 cursor-pointer">
                                    <Icon name="camera" size={10} /> + Foto QC
                                    <input
                                      type="file"
                                      accept="image/*"
                                      className="hidden"
                                      onChange={(e) => {
                                        const f = e.target.files?.[0];
                                        if (!f) return;
                                        const r = new FileReader();
                                        r.onload = () => onAttachAfterPhoto(ord.id, r.result);
                                        r.readAsDataURL(f);
                                      }}
                                    />
                                  </label>
                                )}
                              </div>

                              <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-[10px]">
                                <span className="text-slate-500">PIC: <strong className="text-slate-700">{staffName}</strong></span>
                                {nextStage && (
                                  <button
                                    onClick={() => onAdvanceStatus(ord.id)}
                                    className="px-2 py-1 bg-slate-900 hover:bg-tosca-600 text-white font-bold rounded-lg transition-colors"
                                  >
                                    &rarr; {nextStage === 'QC & Siap Diambil' ? 'Siap Ambil' : nextStage}
                                  </button>
                                )}
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 text-[11px] uppercase tracking-wider text-slate-500 border-b border-slate-100">
                      <th className="py-3 px-4">No Order</th>
                      <th className="py-3 px-4">Tanggal</th>
                      <th className="py-3 px-4">Customer</th>
                      <th className="py-3 px-4">Sepatu &amp; Layanan</th>
                      <th className="py-3 px-4">Status</th>
                      <th className="py-3 px-4 text-right">Aksi</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-xs">
                    {visibleOrders.map((ord) => {
                      const currentIdx = STATUS_FLOW.indexOf(ord.status);
                      const nextStage = currentIdx < STATUS_FLOW.length - 1 ? STATUS_FLOW[currentIdx + 1] : null;
                      return (
                        <tr key={ord.id} className="hover:bg-slate-50">
                          <td className="py-3 px-4 font-mono font-bold text-slate-900 whitespace-nowrap">{ord.id}</td>
                          <td className="py-3 px-4 text-slate-600 whitespace-nowrap">{ord.dateIn}</td>
                          <td className="py-3 px-4 font-semibold text-slate-800">{ord.customerName}</td>
                          <td className="py-3 px-4">
                            <p className="font-bold text-slate-900">{ord.shoeBrand}</p>
                            <p className="text-[11px] text-tosca-700">{ord.services.join(', ')}</p>
                          </td>
                          <td className="py-3 px-4">
                            <span className="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-800">
                              {ord.status}
                            </span>
                          </td>
                          <td className="py-3 px-4 text-right whitespace-nowrap">
                            {nextStage ? (
                              <button
                                onClick={() => onAdvanceStatus(ord.id)}
                                className="px-3 py-1.5 bg-tosca-600 hover:bg-tosca-700 text-white font-bold rounded-xl text-[11px]"
                              >
                                Pindah &rarr; {nextStage}
                              </button>
                            ) : (
                              <span className="text-[11px] font-semibold text-emerald-600">Selesai ✓</span>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Photo Preview Modal */}
          {previewPhotoModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4" onClick={() => setPreviewPhotoModal(null)}>
              <div className="bg-white rounded-2xl max-w-md w-full p-4 space-y-3 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between">
                  <h4 className="font-bold text-slate-900 text-sm">{previewPhotoModal.title}</h4>
                  <button onClick={() => setPreviewPhotoModal(null)} className="p-1 rounded-lg hover:bg-slate-100">
                    <Icon name="x" size={16} />
                  </button>
                </div>
                <img src={previewPhotoModal.src} alt={previewPhotoModal.title} className="w-full max-h-80 object-contain rounded-xl bg-slate-100" />
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 6. HALAMAN CUSTOMER & MEMBERSHIP (LOYALTY 10X CUCI GRATIS 1X)
    // =========================================================================
    const CustomersPage = ({ customers, orders, selectedBranch, addToast }) => {
      const [search, setSearch] = useState('');
      const [tierFilter, setTierFilter] = useState('ALL');
      const [selectedCustomer, setSelectedCustomer] = useState(null);

      const filteredCustomers = useMemo(() => {
        return customers
          .filter((c) => {
            if (selectedBranch !== 'ALL' && c.branchId !== selectedBranch) return false;
            if (tierFilter !== 'ALL' && c.tier !== tierFilter) return false;
            if (search.trim()) {
              const q = search.toLowerCase();
              if (!c.name.toLowerCase().includes(q) && !c.phone.includes(q)) return false;
            }
            return true;
          })
          .sort((a, b) => b.totalSpend - a.totalSpend);
      }, [customers, selectedBranch, tierFilter, search]);

      const customerOrders = useMemo(() => {
        if (!selectedCustomer) return [];
        return orders.filter((o) => o.customerName.toLowerCase() === selectedCustomer.name.toLowerCase());
      }, [selectedCustomer, orders]);

      const tierBadge = (tier) => {
        if (tier === 'VIP') return 'bg-slate-900 text-tosca-300';
        if (tier === 'Gold') return 'bg-amber-100 text-amber-800';
        if (tier === 'Silver') return 'bg-slate-200 text-slate-800';
        return 'bg-tosca-50 text-tosca-700';
      };

      return (
        <div className="space-y-5">
          <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div className="relative flex-1 min-w-[220px] max-w-sm">
              <span className="absolute left-3 top-2.5 text-slate-400"><Icon name="search" size={14} /></span>
              <input
                type="text"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Cari nama pelanggan atau nomor WA..."
                className="w-full pl-8 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-tosca-600"
              />
            </div>
            <div className="flex flex-wrap gap-1.5">
              {['ALL', 'VIP', 'Gold', 'Silver', 'Regular'].map((t) => (
                <button
                  key={t}
                  onClick={() => setTierFilter(t)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-semibold ${
                    tierFilter === t ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  {t === 'ALL' ? 'Semua Tier' : t}
                </button>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-50 text-[11px] uppercase tracking-wider text-slate-500 border-b border-slate-100">
                    <th className="py-3 px-4">Pelanggan</th>
                    <th className="py-3 px-4">Membership</th>
                    <th className="py-3 px-4">Total Cuci</th>
                    <th className="py-3 px-4">Progress Loyalty (10x)</th>
                    <th className="py-3 px-4">Total Belanja</th>
                    <th className="py-3 px-4">Terakhir Cuci</th>
                    <th className="py-3 px-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-xs">
                  {filteredCustomers.map((c) => {
                    const mod = c.totalWashes % 10;
                    const progress = mod === 0 && c.totalWashes > 0 ? 10 : mod;
                    const freeEligible = progress === 10;
                    return (
                      <tr key={c.id} className="hover:bg-slate-50">
                        <td className="py-3 px-4">
                          <p className="font-bold text-slate-900">{c.name}</p>
                          <p className="text-[11px] text-slate-500">{c.phone}</p>
                        </td>
                        <td className="py-3 px-4">
                          <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold ${tierBadge(c.tier)}`}>
                            {c.tier}
                          </span>
                        </td>
                        <td className="py-3 px-4 font-bold text-slate-900">{c.totalWashes} psg</td>
                        <td className="py-3 px-4 min-w-[160px]">
                          <div className="flex items-center justify-between text-[11px] mb-1">
                            <span className="font-semibold text-slate-700">{progress}/10 Stamp</span>
                            {freeEligible && <span className="text-emerald-600 font-bold">Gratis 1x!</span>}
                          </div>
                          <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                            <div
                              className={`h-full rounded-full ${freeEligible ? 'bg-emerald-500' : 'bg-tosca-600'}`}
                              style={{ width: `${progress * 10}%` }}
                            />
                          </div>
                        </td>
                        <td className="py-3 px-4 font-bold text-tosca-700">{formatRupiah(c.totalSpend)}</td>
                        <td className="py-3 px-4 text-slate-600">{c.lastWash}</td>
                        <td className="py-3 px-4 text-right whitespace-nowrap space-x-1.5">
                          <button
                            onClick={() => setSelectedCustomer(c)}
                            className="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold rounded-lg text-[11px]"
                          >
                            Riwayat
                          </button>
                          <button
                            onClick={() => {
                              openWhatsAppMessage(
                                c.phone,
                                `Halo ${c.name}, terima kasih menjadi member *SPATWO — Fresh Step Daily*! Progress loyalty Anda saat ini ${progress}/10 cuci.`
                              );
                              addToast('Membuka WhatsApp', `Chat untuk ${c.name} dibuka.`, 'wa');
                            }}
                            className="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-[11px]"
                          >
                            WA
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Customer Order History Modal */}
          {selectedCustomer && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4" onClick={() => setSelectedCustomer(null)}>
              <div className="bg-white rounded-2xl max-w-lg w-full p-5 space-y-4 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <h4 className="font-bold text-slate-900 text-base">{selectedCustomer.name}</h4>
                    <p className="text-xs text-slate-500">{selectedCustomer.phone} • Total {selectedCustomer.totalWashes} pasang ({formatRupiah(selectedCustomer.totalSpend)})</p>
                  </div>
                  <button onClick={() => setSelectedCustomer(null)} className="p-1.5 rounded-lg hover:bg-slate-100">
                    <Icon name="x" size={16} />
                  </button>
                </div>
                <div className="max-h-72 overflow-y-auto divide-y divide-slate-100">
                  {customerOrders.map((ord) => (
                    <div key={ord.id} className="py-2.5 flex items-center justify-between text-xs">
                      <div>
                        <p className="font-bold text-slate-900">{ord.shoeBrand}</p>
                        <p className="text-[11px] text-slate-500">{ord.dateIn} • {ord.services.join(', ')}</p>
                      </div>
                      <span className="font-bold text-tosca-700">{formatRupiah(ord.total)}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 7. HALAMAN KEUANGAN & LABA RUGI
    // =========================================================================
    const FinancePage = ({ finance, branches, selectedBranch, dateRange, onAddExpense, addToast }) => {
      const [expDesc, setExpDesc] = useState('');
      const [expCategory, setExpCategory] = useState('Bahan Baku');
      const [expAmount, setExpAmount] = useState('');

      const filteredTx = useMemo(() => {
        return finance.filter((f) => {
          if (selectedBranch !== 'ALL' && f.branchId !== selectedBranch) return false;
          if (dateRange.start && f.date < dateRange.start) return false;
          if (dateRange.end && f.date > dateRange.end) return false;
          return true;
        });
      }, [finance, selectedBranch, dateRange]);

      const totalIncome = filteredTx.filter((t) => t.type === 'INCOME').reduce((s, t) => s + t.amount, 0);
      const totalExpense = filteredTx.filter((t) => t.type === 'EXPENSE').reduce((s, t) => s + t.amount, 0);
      const netProfit = totalIncome - totalExpense;

      const handleCreateExpense = (e) => {
        e.preventDefault();
        if (!expDesc.trim() || !expAmount) return;
        onAddExpense({
          id: `FIN-EXP-${Date.now()}`,
          date: TODAY_STR,
          type: 'EXPENSE',
          category: expCategory,
          description: expDesc.trim(),
          branchId: selectedBranch === 'ALL' ? 'BR-JKS' : selectedBranch,
          amount: Number(expAmount),
        });
        setExpDesc('');
        setExpAmount('');
      };

      const handleExportCSV = () => {
        const headers = ['ID', 'Tanggal', 'Tipe', 'Kategori', 'Keterangan', 'Nominal'];
        const rows = filteredTx.map((t) => [t.id, t.date, t.type, t.category, `"${t.description}"`, t.amount]);
        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
        const link = document.createElement('a');
        link.setAttribute('href', encodeURI(csvContent));
        link.setAttribute('download', `Laporan-Keuangan-SPATWO-${TODAY_STR}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        addToast('Export CSV Berhasil', 'Laporan keuangan SPATWO berhasil diunduh.');
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
              <p className="text-xs text-slate-500">Total Pemasukan</p>
              <p className="text-2xl font-extrabold text-emerald-600 mt-1">{formatRupiah(totalIncome)}</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
              <p className="text-xs text-slate-500">Total Pengeluaran</p>
              <p className="text-2xl font-extrabold text-rose-600 mt-1">{formatRupiah(totalExpense)}</p>
            </div>
            <div className="bg-slate-900 text-white p-5 rounded-2xl shadow-xs">
              <p className="text-xs text-slate-400">Laba Bersih (Net Profit)</p>
              <p className="text-2xl font-extrabold text-tosca-400 mt-1">{formatRupiah(netProfit)}</p>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-4 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
              <h3 className="font-bold text-slate-900 text-sm mb-3">Catat Pengeluaran Operasional</h3>
              <form onSubmit={handleCreateExpense} className="space-y-3">
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">Kategori</label>
                  <select
                    value={expCategory}
                    onChange={(e) => setExpCategory(e.target.value)}
                    className="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-xl"
                  >
                    <option value="Bahan Baku">Beli Bahan &amp; Sabun</option>
                    <option value="Gaji Karyawan">Gaji &amp; Komisi</option>
                    <option value="Listrik & Air">Listrik, Air &amp; Internet</option>
                    <option value="Sewa Tempat">Sewa Outlet</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">Keterangan</label>
                  <input
                    type="text"
                    value={expDesc}
                    onChange={(e) => setExpDesc(e.target.value)}
                    placeholder="Contoh: Beli Sabun & Sikat Halus"
                    className="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-xl"
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">Nominal (Rp)</label>
                  <input
                    type="number"
                    value={expAmount}
                    onChange={(e) => setExpAmount(e.target.value)}
                    placeholder="150000"
                    className="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-xl"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl"
                >
                  Simpan Pengeluaran
                </button>
              </form>
            </div>

            <div className="lg:col-span-8 bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
              <div className="p-4 border-b border-slate-100 flex items-center justify-between">
                <h3 className="font-bold text-slate-900 text-sm">Buku Kas &amp; Mutasi Transaksi ({filteredTx.length})</h3>
                <div className="flex gap-2">
                  <button
                    onClick={handleExportCSV}
                    className="px-3 py-1.5 bg-tosca-600 hover:bg-tosca-700 text-white text-xs font-bold rounded-xl inline-flex items-center gap-1.5"
                  >
                    <Icon name="download" size={14} /> Export Excel (CSV)
                  </button>
                  <button
                    onClick={() => window.print()}
                    className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold rounded-xl"
                  >
                    Cetak PDF
                  </button>
                </div>
              </div>
              <div className="max-h-[420px] overflow-y-auto divide-y divide-slate-100 text-xs">
                {filteredTx.map((t) => (
                  <div key={t.id} className="p-3.5 flex items-center justify-between gap-3 hover:bg-slate-50">
                    <div>
                      <p className="font-bold text-slate-900">{t.description}</p>
                      <p className="text-[11px] text-slate-500">{t.date} • {t.category}</p>
                    </div>
                    <span className={`font-extrabold whitespace-nowrap ${t.type === 'INCOME' ? 'text-emerald-600' : 'text-rose-600'}`}>
                      {t.type === 'INCOME' ? '+' : '-'} {formatRupiah(t.amount)}
                    </span>
                  </div>
                ))}
              </div>
            </div>

      const [toasts, setToasts] = useState([]);

        try { return localStorage.getItem('spatwo_custom_logo') || null; } catch (e) { return null; }
      });
      const [customQrImage, setCustomQrImage] = useState(() => {
        try { return localStorage.getItem('spatwo_custom_qr') || null; } catch (e) { return null; }
      });

      });

      const handleUpdateLogo = (dataUrl) => {
        setCustomLogo(dataUrl);
        try {
          if (dataUrl) localStorage.setItem('spatwo_custom_logo', dataUrl);
          else localStorage.removeItem('spatwo_custom_logo');
        } catch (e) {}
      };

      const handleUpdateQrImage = (dataUrl) => {
        setCustomQrImage(dataUrl);
        try {
          if (dataUrl) localStorage.setItem('spatwo_custom_qr', dataUrl);
          else localStorage.removeItem('spatwo_custom_qr');
        } catch (e) {}
      };

      const handleUpdatePaymentText = (txt) => {
        setPaymentInfoText(txt);
        try { localStorage.setItem('spatwo_payment_text', txt); } catch (e) {}
      };

      const addToast = (title, message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, title, message, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 5500);
      };

      const menuItems = useMemo(() => {
        const all = [
          { id: 'dashboard', label: 'Dashboard Utama', icon: 'layout-dashboard', roles: ['owner'] },
          { id: 'pos', label: 'Order / POS Kasir', icon: 'plus-circle', roles: ['owner', 'kasir'] },
          { id: 'tracking', label: 'Tracking & Status', icon: 'kanban', roles: ['owner', 'kasir', 'staff', 'kurir'] },
          { id: 'customers', label: 'Customer & Loyalty', icon: 'users', roles: ['owner', 'kasir'] },
          { id: 'finance', label: 'Keuangan & Laba Rugi', icon: 'wallet', roles: ['owner'] },
          { id: 'inventory', label: 'Inventory Bahan', icon: 'package', roles: ['owner', 'kasir', 'staff'] },
          { id: 'employees', label: 'Karyawan & Kinerja', icon: 'award', roles: ['owner'] },
          { id: 'settings', label: 'Cabang & Setting', icon: 'settings', roles: ['owner'] },
        ];
        return all.filter((m) => m.roles.includes(role));
      }, [role]);

      useEffect(() => {
        if (!menuItems.some((m) => m.id === activeMenu)) {
          setActiveMenu(menuItems[0]?.id || 'tracking');
        }
      }, [role, menuItems, activeMenu]);

      const handleCreateOrder = (newOrder) => {
        setOrders((prev) => [newOrder, ...prev]);
        setFinance((prev) => [
          {
            id: `FIN-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
            date: newOrder.dateIn,
            type: 'INCOME',
            category: 'Pendapatan Cuci Sepatu',
            description: `${newOrder.id} • ${newOrder.customerName} (${newOrder.shoeBrand})`,
            branchId: newOrder.branchId,
            amount: newOrder.total,
          },
          ...prev,
        ]);
        setCustomers((prev) => {
          const existing = prev.find((c) => c.name.toLowerCase() === newOrder.customerName.toLowerCase());
          if (existing) {
            const newWashes = existing.totalWashes + 1;
            const newSpend = existing.totalSpend + newOrder.total;
            const newTier = newWashes >= 12 ? 'VIP' : newWashes >= 6 ? 'Gold' : newWashes >= 3 ? 'Silver' : 'Regular';
            return prev.map((c) =>
              c.id === existing.id
                ? { ...c, totalWashes: newWashes, totalSpend: newSpend, lastWash: newOrder.dateIn, tier: newTier }
                : c
            );
          }
          return [
            {
              id: `CUST-${Date.now()}`,
              name: newOrder.customerName,
              phone: newOrder.customerPhone,
              branchId: newOrder.branchId,
              totalWashes: 1,
              totalSpend: newOrder.total,
              lastWash: newOrder.dateIn,
              tier: 'Regular',
            },
            ...prev,
          ];
        });

        setOrders((prev) =>
          prev.map((o) => {
            if (o.id !== orderId) return o;
            if (targetStatus === 'QC & Siap Diambil' && o.status !== 'QC & Siap Diambil') {
              const waMsg = `Halo ${o.customerName}, sepatu *${o.shoeBrand}* kamu sudah lolos QC dan siap diambil di *SPATWO — Fresh Step Daily* (${o.id}). Terima kasih!`;
              openWhatsAppMessage(o.customerPhone, waMsg);

              setInventory((inv) =>
                inv.map((item) =>
                  item.id === 'INV-1' ? { ...item, stock: Math.max(0, item.stock - 1) } : item
                )
              );
            }
            return { ...o, status: targetStatus };
          })
        );

        const found = orders.find((o) => o.id === orderId);
        if (!found) return;
        const idx = STATUS_FLOW.indexOf(found.status);
        if (idx >= 0 && idx < STATUS_FLOW.length - 1) {
          handleSetStatus(orderId, STATUS_FLOW[idx + 1]);

        const found = orders.find((o) => o.id.toUpperCase() === code);

          addToast('Barcode Tidak Ditemukan', `No Order "${code}" tidak terdaftar.`, 'warn');

        setOrders((prev) =>
          prev.map((o) => (o.id === orderId ? { ...o, afterPhoto: dataUrl } : o))

      };

      const activeMenuObj = menuItems.find((m) => m.id === activeMenu) || menuItems[0];

      return (
        <div className="min-h-screen flex bg-slate-50">

            </div>

              {menuItems.map((item) => {

                  <button
                    key={item.id}
                    onClick={() => setActiveMenu(item.id)}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      active
                        ? 'bg-slate-900 text-white shadow-xs'
                        : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                    }`}
                  >
                    <Icon name={item.icon} size={17} className={active ? 'text-tosca-400' : 'text-slate-400'} />
                    <span>{item.label}</span>
                  </button>
                );
              })}
            </nav>

            {/* Sidebar Footer: Role Switcher Profile */}

                </div>

                  value={role}

                >
                  <option value="owner">Owner / Super Admin</option>
                  <option value="kasir">Admin Cabang / Kasir</option>
                  <option value="staff">Staff Cuci</option>
                  <option value="kurir">Kurir / Driver</option>

              </div>
              <div className="bg-tosca-50/80 px-3 py-2 rounded-xl border border-tosca-100 text-[11px] flex items-center justify-between">
                <span className="font-bold text-tosca-900">SPATWO Enterprise</span>
                <span className="text-tosca-700 font-semibold">{orders.length} Item</span>
              </div>
            </div>
          </aside>

          {/* Mobile Drawer */}
          {mobileMenuOpen && (
            <div className="fixed inset-0 z-50 lg:hidden flex">
              <div className="fixed inset-0 bg-slate-900/50" onClick={() => setMobileMenuOpen(false)} />
              <div className="relative w-64 max-w-xs bg-white h-full p-4 flex flex-col z-10">
                <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                  <div className="flex items-center gap-2.5">
                    <BrandEmblem size={36} customLogo={customLogo} />
                    <div>
                      <p className="font-bold text-sm text-slate-900">SPATWO</p>
                      <p className="text-[10px] text-tosca-600 font-medium">Fresh Step Daily</p>
                    </div>
                  </div>
                  <button onClick={() => setMobileMenuOpen(false)} className="p-1.5 rounded-lg hover:bg-slate-100">
                    <Icon name="x" size={18} />
                  </button>
                </div>
                <nav className="flex-1 py-3 space-y-1">
                  {menuItems.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => {
                        setActiveMenu(item.id);
                        setMobileMenuOpen(false);
                      }}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold ${
                        activeMenu === item.id ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      <Icon name={item.icon} size={16} />
                      <span>{item.label}</span>
                    </button>
                  ))}
                </nav>
                <div className="pt-3 border-t border-slate-100">
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Ganti Role Akses</label>
                  <select
                    value={role}
                    onChange={(e) => {
                      setRole(e.target.value);
                      setMobileMenuOpen(false);
                    }}
                    className="w-full bg-slate-900 text-white text-xs font-semibold px-3 py-2 rounded-xl"
                  >
                    <option value="owner">Owner / Super Admin</option>
                    <option value="kasir">Admin Cabang / Kasir</option>
                    <option value="staff">Staff Cuci</option>
                    <option value="kurir">Kurir / Driver</option>
                  </select>
                </div>
              </div>
            </div>
          )}

          {/* Main Workspace */}
          <div className="flex-1 lg:pl-64 flex flex-col min-w-0">
            {/* Clean Top Header Bar */}
            <header className="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 sm:px-6 py-3.5">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setMobileMenuOpen(true)}
                    className="lg:hidden p-2 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50"
                  >
                    <Icon name="menu" size={18} />
                  </button>
                  <div>
                    <h2 className="font-bold text-slate-900 text-base sm:text-lg leading-tight">
                      {activeMenuObj?.label}
                    </h2>
                    <p className="text-[11px] text-slate-500">
                      Rabu, 25 November 2026 • SPATWO — Fresh Step Daily
                    </p>
                  </div>
                </div>

                {/* Quick Period Presets, Date Range & Branch Selector */}
                <div className="flex flex-wrap items-center gap-2">
                  <div className="hidden sm:flex items-center bg-slate-100 p-1 rounded-xl text-[11px] font-semibold">
                    {[
                      { label: 'Semua', start: '', end: '' },
                      { label: 'Bulan Ini', start: '2026-11-01', end: '2026-11-30' },
                      { label: 'Bulan Lalu', start: '2026-10-01', end: '2026-10-31' },
                      { label: 'Kuartal Ini', start: '2026-09-01', end: '2026-11-30' },
                    ].map((preset) => {
                      const isActive = dateRange.start === preset.start && dateRange.end === preset.end;
                      return (
                        <button
                          key={preset.label}
                          onClick={() => setDateRange({ start: preset.start, end: preset.end })}
                          className={`px-2.5 py-1 rounded-lg transition-all ${
                            isActive ? 'bg-white text-tosca-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          {preset.label}
                        </button>
                      );
                    })}
                  </div>

                  <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs">
                    <Icon name="calendar" size={13} className="text-tosca-600" />
                    <input
                      type="date"
                      value={dateRange.start}
                      onChange={(e) => setDateRange((prev) => ({ ...prev, start: e.target.value }))}
                      className="bg-transparent text-slate-700 focus:outline-none text-[11px]"
                      title="Dari Tanggal"
                    />
                    <span className="text-slate-400">-</span>
                    <input
                      type="date"
                      value={dateRange.end}
                      onChange={(e) => setDateRange((prev) => ({ ...prev, end: e.target.value }))}
                      className="bg-transparent text-slate-700 focus:outline-none text-[11px]"
                      title="Sampai Tanggal"
                    />
                    {(dateRange.start || dateRange.end) && (
                      <button
                        onClick={() => setDateRange({ start: '', end: '' })}
                        className="ml-1 text-[10px] font-bold text-rose-600 hover:underline"
                      >
                        Reset
                      </button>
                    )}
                  </div>

                  <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs">
                    <Icon name="map-pin" size={13} className="text-tosca-600" />
                    <select
                      value={selectedBranch}
                      onChange={(e) => setSelectedBranch(e.target.value)}
                      className="bg-transparent font-medium text-slate-700 focus:outline-none text-xs"
                    >
                      <option value="ALL">Semua Cabang ({branches.length})</option>
                      {branches.map((b) => (
                        <option key={b.id} value={b.id}>{b.name}</option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>
            </header>

            <main className="flex-1 p-4 sm:p-6 max-w-[1600px] w-full mx-auto">
              {activeMenu === 'dashboard' && (
                <DashboardPage
                  orders={orders}
                  customers={customers}
                  branches={branches}
                  finance={finance}
                  selectedBranch={selectedBranch}
                  dateRange={dateRange}
                  onNavigate={setActiveMenu}
                />
              )}
              {activeMenu === 'pos' && (
                <POSPage
                  orders={orders}
                  customers={customers}
                  services={services}
                  promos={promos}
                  branches={branches}
                  employees={employees}
                  selectedBranch={selectedBranch}
                  customLogo={customLogo}
                  customQrImage={customQrImage}
                  paymentInfoText={paymentInfoText}
                  onCreateOrder={handleCreateOrder}
                  onScanAdvance={handleScanAdvance}
                  addToast={addToast}
                />
              )}
              {activeMenu === 'tracking' && (
                <TrackingPage
                  orders={orders}
                  employees={employees}
                  selectedBranch={selectedBranch}
                  dateRange={dateRange}
                  role={role}
                  onAdvanceStatus={handleAdvanceStatus}
                  onSetStatus={handleSetStatus}
                  onAttachAfterPhoto={handleAttachAfterPhoto}
                />
              )}
              {activeMenu === 'customers' && (
                <CustomersPage
                  customers={customers}
                  orders={orders}
                  selectedBranch={selectedBranch}
                  addToast={addToast}
                />
              )}
              {activeMenu === 'finance' && (
                <FinancePage
                  finance={finance}
                  branches={branches}
                  selectedBranch={selectedBranch}
                  dateRange={dateRange}
                  onAddExpense={(tx) => {
                    setFinance((prev) => [tx, ...prev]);
                    addToast('Pengeluaran Dicatat', `${tx.description} (${formatRupiah(tx.amount)}) disimpan.`);
                  }}
                  addToast={addToast}
                />
              )}
              {activeMenu === 'inventory' && (
                <InventoryPage
                  inventory={inventory}
                  onAdjustStock={(id, delta) => {
                    setInventory((prev) =>
                      prev.map((i) => (i.id === id ? { ...i, stock: Math.max(0, i.stock + delta) } : i))
                    );
                    addToast('Stok Diperbarui', 'Jumlah stok bahan berhasil disesuaikan.');
                  }}
                />
              )}
              {activeMenu === 'employees' && (
                <EmployeesPage
                  employees={employees}
                  branches={branches}
                  selectedBranch={selectedBranch}
                />
              )}
              {activeMenu === 'settings' && (
                <SettingsPage
                  branches={branches}
                  services={services}
                  promos={promos}
                  customLogo={customLogo}
                  customQrImage={customQrImage}
                  paymentInfoText={paymentInfoText}
                  onUpdateLogo={handleUpdateLogo}
                  onUpdateQrImage={handleUpdateQrImage}
                  onUpdatePaymentText={handleUpdatePaymentText}
                  onAddBranch={(b) => {
                    setBranches((prev) => [...prev, b]);
                    addToast('Cabang Ditambahkan', `${b.name} aktif di sistem.`);
                  }}
                  onUpdateServicePrice={(id, price) => {
                    setServices((prev) => prev.map((s) => (s.id === id ? { ...s, price } : s)));
                  }}
                  onTogglePromo={(id) => {
                    setPromos((prev) => prev.map((p) => (p.id === id ? { ...p, active: !p.active } : p)));
                  }}
                  addToast={addToast}
                />
              )}
            </main>
          </div>

          {/* Floating Toast Notification Stack */}
          <div className="fixed bottom-4 right-4 z-50 space-y-2 max-w-sm w-full pointer-events-none px-4 sm:px-0">
            {toasts.map((t) => (
              <div
                key={t.id}
                className="pointer-events-auto bg-slate-900 text-white p-3.5 rounded-2xl shadow-xl border border-slate-700/80 flex items-start gap-3"
              >
                <div className={`p-1.5 rounded-lg shrink-0 ${t.type === 'wa' ? 'bg-emerald-500/20 text-emerald-400' : t.type === 'warn' ? 'bg-amber-500/20 text-amber-400' : 'bg-tosca-500/20 text-tosca-400'}`}>
                  <Icon name={t.type === 'wa' ? 'message-circle' : t.type === 'warn' ? 'alert-triangle' : 'bell'} size={16} />
                </div>
                <div className="flex-1 min-w-0">
                  <p className="font-bold text-xs">{t.title}</p>
                  <p className="text-[11px] text-slate-300 mt-0.5 leading-relaxed">{t.message}</p>
                </div>
                <button
                  onClick={() => setToasts((prev) => prev.filter((item) => item.id !== t.id))}
                  className="text-slate-400 hover:text-white"
                >
                  <Icon name="x" size={14} />
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
