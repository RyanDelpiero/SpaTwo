      if (digits.startsWith('0')) return '62' + digits.slice(1);

      return '62' + digits;

        const estDone = d.toISOString().slice(0, 10);
        return {
          ...rec,
          estDone,
          status: 'Diambil',
          method: idx % 5 === 0 ? 'Pickup' : 'Drop Off',

    const generateInitialFinance = () => {
      const incomes = [...MASTER_SHOE_RECORDS]
        .reverse()
        .filter((r) => r.total > 0)
        .map((r, i) => ({
          id: `FIN-INC-${i + 1}`,
          date: r.dateIn,
          type: 'INCOME',
          category: 'Pendapatan Cuci Sepatu',
          description: `${r.id} • ${r.customerName} (${r.shoeBrand})`,
          branchId: r.branchId,
          amount: r.total,
        }));

      const expenses = [
        { id: 'FIN-EXP-1', date: '2026-11-05', type: 'EXPENSE', category: 'Beli Bahan', description: 'Restock Sabun Cleaner & Unyellowing Gel', branchId: 'BR-JKT-SEL', amount: 185000 },
        { id: 'FIN-EXP-2', date: '2026-10-15', type: 'EXPENSE', category: 'Beli Bahan', description: 'Sikat Horsehair & Parfum Fresh Step', branchId: 'BR-JKT-SEL', amount: 140000 },
        { id: 'FIN-EXP-3', date: '2026-09-10', type: 'EXPENSE', category: 'Listrik & Air', description: 'Operasional Pengering & Steamer', branchId: 'BR-JKT-PUS', amount: 120000 },
        { id: 'FIN-EXP-4', date: '2026-06-12', type: 'EXPENSE', category: 'Beli Bahan', description: 'Packaging Box & Silica Gel SPATWO', branchId: 'BR-JKT-BAR', amount: 165000 },

      return [...incomes, ...expenses].sort((a, b) => b.date.localeCompare(a.date));

    // =========================================================================
    // 3. DASHBOARD UTAMA (OWNER VIEW)
    // =========================================================================
    const DashboardPage = ({ orders, customers, branches, finance, selectedBranch, dateRange, onNavigate }) => {

      const filteredOrders = useMemo(() => {

      const filteredFinance = useMemo(() => {
        return finance.filter((f) => {
          if (selectedBranch !== 'ALL' && f.branchId !== selectedBranch) return false;
          if (dateRange.start && f.date < dateRange.start) return false;
          if (dateRange.end && f.date > dateRange.end) return false;

      const kpis = useMemo(() => {
        const todayOrders = filteredOrders.filter((o) => o.dateIn === TODAY_STR);

        const revPeriod = filteredOrders.reduce((s, o) => s + (Number(o.total) || 0), 0);
        const inProcess = filteredOrders.filter((o) => ['Baru Masuk', 'Antrian', 'Dicuci', 'Drying'].includes(o.status)).length;

        const repeatCustCount = customers.filter((c) => (c.totalWashes || 0) > 1).length;

        return {
          totalItems: filteredOrders.length,

      // Revenue Growth Chart Data (Fitted cleanly without horizontal overflow)

        return months.map((m) => {

      const maxRev = Math.max(1, ...revenueSeries.map((d) => d.value));

      const maxSrv = Math.max(1, ...serviceStats.map((s) => s.count));

      const statusStats = useMemo(() => {

            <div className={`p-4 rounded-2xl border shadow-xs ${kpis.overdueCount > 0 ? 'bg-rose-50 border-rose-200' : 'bg-white border-slate-200/80'}`}>

                <p className="text-[11px] font-semibold text-slate-500">Sepatu Overdue</p>

                {kpis.overdueCount}

            <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs">
              <p className="text-[11px] font-semibold text-slate-500">Total Member Aktif</p>

              <p className="text-[11px] font-semibold text-tosca-600 mt-1">Repeat Rate {kpis.repeatRate}%</p>
            </div>
          </div>

          {/* Charts Row */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Pertumbuhan Revenue (Fixed responsive bar layout without horizontal overflow) */}
            <div className="lg:col-span-5 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs flex flex-col justify-between overflow-hidden">
              <div className="flex items-start justify-between gap-2 mb-4">
                <div>
                  <h3 className="font-bold text-slate-900 text-base">Pertumbuhan Revenue</h3>

                </div>
                <div className="flex items-center bg-slate-100 p-1 rounded-xl text-[11px] font-semibold shrink-0">
                  {[
                    { id: 'daily', label: 'Harian' },
                    { id: 'weekly', label: 'Mingguan' },
                    { id: 'monthly', label: 'Bulanan' },

                    <button
                      key={p.id}
                      onClick={() => setChartPeriod(p.id)}
                      className={`px-2.5 py-1 rounded-lg transition-all ${
                        chartPeriod === p.id ? 'bg-white text-tosca-700 shadow-xs' : 'text-slate-600'

                      {p.label}

              </div>

              <div className="h-52 flex items-end gap-1.5 sm:gap-2 pt-6 pb-1 px-1 w-full">
                {revenueSeries.map((item) => {
                  const pct = Math.max(8, Math.round((item.value / maxRev) * 100));
                  const compactVal = item.value >= 1000 ? `${Math.round(item.value / 1000)}rb` : '0';
                  return (
                    <div key={item.label} className="flex-1 min-w-0 flex flex-col items-center group relative h-full justify-end">

                      />

              </div>
            </div>

            {/* Jenis Layanan Terlaris */}

                        />

                  );

              </div>
            </div>

            {/* Status Pengerjaan Donut */}
            <div className="lg:col-span-3 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs flex flex-col justify-between">
              <div>
                <h3 className="font-bold text-slate-900 text-base">Status Pengerjaan</h3>
                <p className="text-xs text-slate-500 mb-3">Proporsi seluruh item masuk</p>

                  <span className="text-[11px] text-slate-500 font-medium">Sepatu</span>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 text-[11px] mt-2">
                {statusStats.map((st) => (
                  <div key={st.status} className="flex items-center justify-between gap-1">
                    <div className="flex items-center gap-1.5 min-w-0">
                      <span style={{ backgroundColor: st.color }} className="w-2 h-2 rounded-full shrink-0" />
                      <span className="text-slate-600 truncate">{st.status}</span>
                    </div>
                    <span className="font-bold text-slate-900">{st.count}</span>

          </div>

          {/* Investor Insight Row + Branch Performance */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Investor Insight: Repeat Rate & Top Brands */}
            <div className="lg:col-span-4 bg-slate-900 text-white p-5 rounded-2xl shadow-xs space-y-4">
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-[10px] font-bold uppercase tracking-wider text-tosca-300">Investor Highlight</span>
                  <h3 className="font-bold text-base mt-0.5">Retensi &amp; Top Merk Sepatu</h3>
                </div>
                <div className="text-right">
                  <p className="font-display font-extrabold text-2xl text-tosca-400">{kpis.repeatRate}%</p>
                  <p className="text-[10px] text-slate-400">Repeat Customer</p>
                </div>
              </div>
              <div className="space-y-2.5 pt-2 border-t border-white/10">
                {topBrands.map(([brand, count], idx) => (
                  <div key={brand} className="flex items-center justify-between text-xs">
                    <div className="flex items-center gap-2">
                      <span className="w-5 h-5 rounded-md bg-white/10 text-tosca-300 font-bold text-[10px] flex items-center justify-center">
                        #{idx + 1}
                      </span>
                      <span className="font-semibold text-slate-100">{brand}</span>
                    </div>
                    <span className="font-bold text-tosca-300">{count} pasang</span>
                  </div>
                ))}
              </div>

            {/* Tabel Performa Cabang */}
            <div className="lg:col-span-8 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs overflow-x-auto">
              <h3 className="font-bold text-slate-900 text-base mb-3">Performa Operasional Cabang</h3>
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="border-b border-slate-100 text-[11px] text-slate-400 uppercase">
                    <th className="py-2.5 pr-4">Cabang</th>
                    <th className="py-2.5 px-3">Total Sepatu</th>
                    <th className="py-2.5 px-3">Revenue</th>
                    <th className="py-2.5 px-3">Rata-rata SLA</th>
                    <th className="py-2.5 pl-3 text-right">Rating</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {branches.map((b) => {
                    const bOrders = filteredOrders.filter((o) => o.branchId === b.id);
                    const bRev = bOrders.reduce((s, o) => s + (Number(o.total) || 0), 0);
                    return (
                      <tr key={b.id} className="hover:bg-slate-50/70">
                        <td className="py-3 pr-4">
                          <p className="font-bold text-slate-900">{b.name}</p>

                        </td>
                        <td className="py-3 px-3 font-bold text-slate-800">{bOrders.length} psg</td>

          {/* Tabel Order Terbaru / Perlu Tindakan */}

    };

    // =========================================================================
    // 4. HALAMAN ORDER / POS KASIR (MULTI-SEPATU + STRUK TEMPLATE + QR)
    // =========================================================================
    const POSPage = ({
      orders,
      customers,
      services,
      promos,
      branches,
      employees,
      selectedBranch,
      customLogo,
      customQrImage,
      paymentInfoText,
      onCreateOrder,
      onScanAdvance,
      addToast,
    }) => {
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [branchId, setBranchId] = useState(selectedBranch !== 'ALL' ? selectedBranch : branches[0]?.id || 'BR-JKT-SEL');
      const [method, setMethod] = useState('Drop Off');
      const [paymentMethod, setPaymentMethod] = useState('QRIS');
      const [promoCode, setPromoCode] = useState('');
      const [estDays, setEstDays] = useState(2);

      // Current shoe item builder
      const [shoeType, setShoeType] = useState('Sneakers');
      const [shoeBrand, setShoeBrand] = useState('');
      const [shoeColor, setShoeColor] = useState('');
      const [selectedServices, setSelectedServices] = useState(['Fast Clean']);
      const [photoPreview, setPhotoPreview] = useState(null);

      // Multi-shoe cart inside 1 Nota
      const [cartItems, setCartItems] = useState([]);
      const [latestReceipt, setLatestReceipt] = useState(null);
      const [scanInput, setScanInput] = useState('');

      const matchingCustomer = useMemo(() => {
        if (!customerName.trim()) return null;
        return customers.find((c) => c.name.toLowerCase() === customerName.trim().toLowerCase());
      }, [customerName, customers]);

      const toggleService = (srvName) => {
        setSelectedServices((prev) =>
          prev.includes(srvName) ? (prev.length > 1 ? prev.filter((s) => s !== srvName) : prev) : [...prev, srvName]
        );
      };

      const calcItemBasePrice = (srvList) => {
        return srvList.reduce((sum, name) => {
          const found = services.find((s) => s.name === name);
          return sum + (found ? Number(found.price) : 0);
        }, 0);
      };

      const handlePhotoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => setPhotoPreview(reader.result);
        reader.readAsDataURL(file);
      };

      const handleAddShoeToCart = () => {
        if (!shoeBrand.trim()) {
          addToast('Merk Sepatu Kosong', 'Isi merk sepatu sebelum menambahkan ke nota.', 'warn');
          return;
        }
        const price = calcItemBasePrice(selectedServices);
        setCartItems((prev) => [
          ...prev,
          {
            id: Date.now() + Math.random(),
            shoeType,
            shoeBrand: shoeBrand.trim(),
            shoeColor: shoeColor.trim() || 'Standard',
            services: [...selectedServices],
            price,
            photo: photoPreview,
          },
        ]);
        setShoeBrand('');
        setShoeColor('');
        setPhotoPreview(null);
        addToast('Sepatu Ditambahkan', `${shoeBrand.trim()} masuk ke daftar nota ini.`);
      };

      // Combine queued cart items + currently typed shoe if filled
      const effectiveItems = useMemo(() => {
        const list = [...cartItems];
        if (shoeBrand.trim()) {
          list.push({
            id: 'CURRENT',
            shoeType,
            shoeBrand: shoeBrand.trim(),
            shoeColor: shoeColor.trim() || 'Standard',
            services: [...selectedServices],
            price: calcItemBasePrice(selectedServices),
            photo: photoPreview,
          });
        }
        return list;
      }, [cartItems, shoeType, shoeBrand, shoeColor, selectedServices, photoPreview, services]);

      const subtotal = useMemo(() => effectiveItems.reduce((s, it) => s + it.price, 0), [effectiveItems]);

      const activePromo = useMemo(() => {
        if (!promoCode.trim()) return null;
        return promos.find((p) => p.active && p.code.toLowerCase() === promoCode.trim().toLowerCase()) || null;
      }, [promoCode, promos]);

      const discountAmount = activePromo ? Math.round((subtotal * activePromo.discountPct) / 100) : 0;
      const grandTotal = Math.max(0, subtotal - discountAmount);

      const estDoneDate = useMemo(() => {
        const d = new Date(TODAY_STR + 'T00:00:00');
        d.setDate(d.getDate() + Number(estDays || 2));
        return d.toISOString().slice(0, 10);
      }, [estDays]);

      const buildReceiptWhatsAppText = (receipt) => {
        const itemLines = receipt.items
          .map((it) => `${it.shoeBrand} (${it.shoeType}${it.shoeColor ? ' - ' + it.shoeColor : ''})`)
          .join(', ');
        const serviceLines = Array.from(new Set(receipt.items.flatMap((it) => it.services))).join(', ');

        return [
          `*STRUK DIGITAL — SPATWO Fresh Step Daily*`,
          ``,
          `Outlet: ${receipt.branchName}`,
          ``,
          `--------------------------------`,
          ``,
          `No. Order : *${receipt.orderNo}*`,
          ``,
          `Customer : ${receipt.customerName}`,
          ``,
          `Item : ${itemLines}`,
          ``,
          `Layanan : ${serviceLines}`,
          ``,
          `Metode : ${receipt.method} • ${receipt.paymentMethod}`,
          ``,
          `Total : *${formatRupiah(receipt.total)}*`,
          ``,
          `Est. Selesai: *${receipt.estDone}*`,
          ``,
          `--------------------------------`,
          ``,
          `${paymentInfoText}`,
          ``,
          `Terima kasih telah mempercayakan sepatu Anda di SPATWO!`,
        ].join('\n');
      };

      const handleSubmitOrder = (e) => {
        e.preventDefault();
        if (!customerName.trim() || !customerPhone.trim()) {
          addToast('Data Customer Belum Lengkap', 'Nama dan No. WhatsApp wajib diisi.', 'warn');
          return;
        }
        if (effectiveItems.length === 0) {
          addToast('Belum Ada Sepatu', 'Isi minimal 1 sepatu yang akan dicuci.', 'warn');
          return;
        }

        const seq = String(orders.length + 101).padStart(3, '0');
        const dateCompact = TODAY_STR.replace(/-/g, '');
        const baseOrderNo = `SPW-${dateCompact}-${seq}`;
        const branchObj = branches.find((b) => b.id === branchId) || branches[0];
        const ratio = subtotal > 0 ? grandTotal / subtotal : 1;

        effectiveItems.forEach((it, idx) => {
          const itemOrderId = effectiveItems.length > 1 ? `${baseOrderNo}-${idx + 1}` : baseOrderNo;
          onCreateOrder({
            id: itemOrderId,
            dateIn: TODAY_STR,
            estDone: estDoneDate,
            customerName: customerName.trim(),
            customerPhone: customerPhone.trim(),
            branchId,
            shoeType: it.shoeType,
            shoeBrand: it.shoeBrand,
            shoeColor: it.shoeColor,
            services: it.services,
            total: Math.round(it.price * ratio),
            status: 'Baru Masuk',
            method,
            paymentMethod,
            paid: true,
            staffId: employees[0]?.id || 'EMP-1',
            photo: it.photo || null,
          });
        });

        const receiptObj = {
          orderNo: baseOrderNo,
          branchName: branchObj?.name || 'SPATWO Jakarta Selatan (TSO)',
          customerName: customerName.trim(),
          customerPhone: customerPhone.trim(),
          items: effectiveItems,
          method,
          paymentMethod,
          total: grandTotal,
          estDone: estDoneDate,
        };
        setLatestReceipt(receiptObj);
        setCartItems([]);
        setShoeBrand('');
        setShoeColor('');
        setPhotoPreview(null);
        addToast('Order Tersimpan!', `No. Order ${baseOrderNo} (${effectiveItems.length} pasang) siap dikirim ke WA.`);
      };

      const handleSendReceiptWhatsApp = () => {
        if (!latestReceipt) return;
        const msg = buildReceiptWhatsAppText(latestReceipt);
        openWhatsAppMessage(latestReceipt.customerPhone, msg);
        addToast('Membuka WhatsApp', `Struk digital untuk ${latestReceipt.customerName} siap dikirim.`);
      };

      const handleCopyReceiptText = () => {
        if (!latestReceipt) return;
        const msg = buildReceiptWhatsAppText(latestReceipt);
        const ta = document.createElement('textarea');
        ta.value = msg;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        addToast('Struk Disalin', 'Teks struk digital berhasil disalin ke clipboard.');
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          {/* Left: POS Form */}
          <form onSubmit={handleSubmitOrder} className="lg:col-span-7 bg-white p-5 sm:p-6 rounded-2xl border border-slate-200/80 shadow-xs space-y-5">

              <select

              >
                {branches.map((b) => (
                  <option key={b.id} value={b.id}>{b.name}</option>

              </select>
            </div>

            {/* Customer Info */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Nama Customer *</label>
                <input
                  type="text"
                  list="spatwo-customers-list"
                  value={customerName}
                  onChange={(e) => {
                    const val = e.target.value;
                    setCustomerName(val);
                    const found = customers.find((c) => c.name.toLowerCase() === val.toLowerCase());

                  placeholder="Ketik / pilih nama member..."

                />
                <datalist id="spatwo-customers-list">
                  {customers.map((c) => (

                {matchingCustomer && (

              <div>

                <input

                <button

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="block text-[11px] font-semibold text-slate-600 mb-1">Jenis Item</label>
                  <select

                <div>

                <div>
                  <label className="block text-[11px] font-semibold text-slate-600 mb-1">Warna</label>

              </div>

              <div>
                <label className="block text-[11px] font-semibold text-slate-600 mb-1.5">Pilih Layanan (Bisa Multi)</label>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                  {services.map((srv) => {
                    const checked = selectedServices.includes(srv.name);
                    return (
                      <button

                        onClick={() => toggleService(srv.name)}
                        className={`p-2.5 rounded-xl border text-left transition-all ${

                            ? 'bg-tosca-50 border-tosca-600 text-tosca-900'

                      >
                        <p className="font-bold text-xs">{srv.name}</p>
                        <p className="text-[11px] font-semibold text-tosca-700 mt-0.5">{formatRupiah(srv.price)}</p>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="flex items-center justify-between pt-1">
                <label className="inline-flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                  <Icon name="camera" size={15} className="text-tosca-600" />
                  <span>{photoPreview ? 'Foto Kondisi Terlampir ✓' : 'Upload Foto Kondisi Awal'}</span>
                  <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                </label>
                {cartItems.length > 0 && (
                  <span className="text-xs font-bold text-tosca-700">{cartItems.length} sepatu di keranjang nota</span>
                )}
              </div>

              {cartItems.length > 0 && (
                <div className="space-y-1.5 pt-2 border-t border-slate-200">
                  {cartItems.map((it, idx) => (
                    <div key={it.id} className="flex items-center justify-between bg-white px-3 py-2 rounded-xl text-xs border border-slate-200/70">
                      <div>
                        <span className="font-bold text-slate-900">{idx + 1}. {it.shoeBrand}</span>
                        <span className="text-slate-500"> ({it.shoeColor}) • {it.services.join(', ')}</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-tosca-700">{formatRupiah(it.price)}</span>
                        <button
                          type="button"
                          onClick={() => setCartItems((prev) => prev.filter((x) => x.id !== it.id))}
                          className="text-rose-500 font-bold"
                        >
                          ×
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Method, Payment, Promo & SLA */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div>
                <label className="block text-[11px] font-semibold text-slate-600 mb-1">Metode</label>
                <select value={method} onChange={(e) => setMethod(e.target.value)} className="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl">
                  <option>Drop Off</option>
                  <option>Pickup</option>
                  <option>Delivery</option>
                </select>
              </div>
              <div>
                <label className="block text-[11px] font-semibold text-slate-600 mb-1">Pembayaran</label>
                <select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)} className="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl">
                  <option>QRIS</option>
                  <option>LinkAja</option>
                  <option>Transfer</option>
                  <option>Cash</option>
                </select>
              </div>
              <div>
                <label className="block text-[11px] font-semibold text-slate-600 mb-1">Estimasi (Hari)</label>
                <input
                  type="number"
                  min="1"
                  max="14"
                  value={estDays}
                  onChange={(e) => setEstDays(e.target.value)}
                  className="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl"
                />
              </div>
              <div>
                <label className="block text-[11px] font-semibold text-slate-600 mb-1">Kode Promo</label>
                <input
                  type="text"
                  value={promoCode}
                  onChange={(e) => setPromoCode(e.target.value)}
                  placeholder="9TO5 / FREE10X"
                  className="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl uppercase"
                />
              </div>
            </div>

            {/* Summary & Submit */}
            <div className="bg-slate-900 text-white p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4">
              <div>
                <p className="text-[11px] text-slate-400">
                  Total ({effectiveItems.length} Pasang) • Est. Selesai <strong className="text-white">{estDoneDate}</strong>
                </p>
                <div className="flex items-baseline gap-2 mt-0.5">
                  <span className="font-display font-extrabold text-2xl text-tosca-400">{formatRupiah(grandTotal)}</span>
                  {discountAmount > 0 && (
                    <span className="text-xs text-emerald-400 font-semibold">(-{formatRupiah(discountAmount)})</span>
                  )}
                </div>
              </div>
              <button
                type="submit"
                className="px-5 py-3 bg-tosca-600 hover:bg-tosca-500 text-white font-bold text-xs rounded-xl transition-colors"
              >
                Simpan Order &amp; Buat Struk
              </button>
            </div>
          </form>

          {/* Right: Quick Barcode Scanner & Digital E-Receipt */}
          <div className="lg:col-span-5 space-y-5">
            {/* Scan Barcode Quick Update */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs space-y-3">
              <div className="flex items-center gap-2.5">
                <div className="p-2 rounded-xl bg-tosca-50 text-tosca-700">
                  <Icon name="scan-line" size={18} />
                </div>
                <div>
                  <h4 className="font-bold text-slate-900 text-sm">Scan Barcode / QR Update Cepat</h4>
                  <p className="text-[11px] text-slate-500">Majukan status pengerjaan order secara instan</p>
                </div>
              </div>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={scanInput}
                  onChange={(e) => setScanInput(e.target.value)}
                  placeholder="Scan / ketik No Order (misal: SPW-...)"
                  className="flex-1 px-3.5 py-2 text-xs border border-slate-200 rounded-xl font-mono"
                />
                <button
                  type="button"
                  onClick={() => {
                    if (!scanInput.trim()) return;
                    onScanAdvance(scanInput.trim().toUpperCase());
                    setScanInput('');
                  }}
                  className="px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-xl"
                >
                  Update
                </button>
              </div>
            </div>

            {/* Digital Receipt Card */}
            {latestReceipt ? (
              <div id="printable-area" className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                <div className="bg-slate-900 text-white p-5 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <BrandEmblem size={42} customLogo={customLogo} />
                    <div>
                      <h4 className="font-display font-bold text-sm">SPATWO — Fresh Step Daily</h4>
                      <p className="text-[11px] text-tosca-300">{latestReceipt.branchName}</p>
                    </div>
                  </div>
                  <span className="px-3 py-1 bg-emerald-500 text-slate-950 font-extrabold text-[11px] rounded-full">
                    LUNAS
                  </span>
                </div>

                <div className="p-5 space-y-3 text-xs">
                  <div className="flex justify-between">
                    <span className="text-slate-500">No. Order</span>
                    <span className="font-mono font-bold text-slate-900">{latestReceipt.orderNo}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Customer</span>
                    <span className="font-bold text-slate-900">{latestReceipt.customerName} ({latestReceipt.customerPhone})</span>
                  </div>
                  <div className="flex justify-between gap-4">
                    <span className="text-slate-500 shrink-0">Item</span>
                    <span className="font-bold text-slate-900 text-right">
                      {latestReceipt.items.map((it) => `${it.shoeBrand} (${it.shoeType} - ${it.shoeColor})`).join(', ')}
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Layanan</span>
                    <span className="font-bold text-tosca-700">
                      {Array.from(new Set(latestReceipt.items.flatMap((it) => it.services))).join(', ')}
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Metode</span>
                    <span className="font-semibold text-slate-800">{latestReceipt.method} • {latestReceipt.paymentMethod}</span>
                  </div>

                    <button

    };

    // =========================================================================
    // 5. HALAMAN TRACKING & STATUS (KANBAN + LIST + EXPORT/IMPORT SYNC)
    // =========================================================================
    const TrackingPage = ({
      orders,
      customers,
      finance,
      employees,
      selectedBranch,
      dateRange,
      role,
      onAdvanceStatus,
      onSetStatus,
      onAttachAfterPhoto,
      onImportData,
      addToast,
    }) => {
      const [viewMode, setViewMode] = useState('kanban');
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [importPreview, setImportPreview] = useState(null);

      const visibleOrders = useMemo(() => {
        return orders.filter((o) => {
          if (selectedBranch !== 'ALL' && o.branchId !== selectedBranch) return false;
          if (dateRange.start && o.dateIn < dateRange.start) return false;
          if (dateRange.end && o.dateIn > dateRange.end) return false;
          if (role === 'kurir' && !['Pickup', 'Delivery'].includes(o.method)) return false;
          if (statusFilter !== 'ALL' && o.status !== statusFilter) return false;
          if (search.trim()) {
            const q = search.toLowerCase();
            const match =
              (o.id || '').toLowerCase().includes(q) ||
              (o.customerName || '').toLowerCase().includes(q) ||
              (o.shoeBrand || '').toLowerCase().includes(q);
            if (!match) return false;
          }
          return true;
        });
      }, [orders, selectedBranch, dateRange, role, statusFilter, search]);

      const handleExportSyncJSON = () => {
        const bundle = {
          app: 'SPATWO - Fresh Step Daily',
          exportedAt: new Date().toISOString(),
          orders,
          customers,
          finance,
        };
        const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SPATWO-Sync-${TODAY_STR}.json`;
        a.click();
        URL.revokeObjectURL(url);
        addToast('Export Sync JSON Berhasil', 'Kirim file .JSON ini ke HP/Laptop lain lalu klik Import.');
      };

      const handleExportCSV = () => {
        const headers = ['No Order', 'Tanggal Masuk', 'Est Selesai', 'Customer', 'No WA', 'Merk Sepatu', 'Layanan', 'Total', 'Status'];
        const rows = visibleOrders.map((o) => [
          o.id,
          o.dateIn,
          o.estDone,
          `"${(o.customerName || '').replace(/"/g, '""')}"`,
          o.customerPhone,
          `"${(o.shoeBrand || '').replace(/"/g, '""')}"`,
          `"${(o.services || []).join(', ')}"`,
          o.total,
          o.status,
        ]);
        const csv = [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SPATWO-Orders-${TODAY_STR}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        addToast('Export Excel CSV Berhasil', `${visibleOrders.length} baris order diunduh.`);
      };

      const handleImportFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            const incomingOrders = Array.isArray(parsed) ? parsed : parsed.orders || [];
            const existingMap = new Map(orders.map((o) => [o.id, o]));
            let newCount = 0;
            let statusChangedCount = 0;
            incomingOrders.forEach((inc) => {
              const cur = existingMap.get(inc.id);
              if (!cur) newCount++;
              else if (cur.status !== inc.status) statusChangedCount++;
            });
            setImportPreview({
              orders: incomingOrders,
              customers: parsed.customers || [],
              finance: parsed.finance || [],
              newCount,
              statusChangedCount,
            });
          } catch (err) {
            addToast('File Tidak Valid', 'Gunakan file backup .JSON hasil Export Sync SPATWO.', 'warn');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      return (
        <div className="space-y-5">
          {/* Control Toolbar */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-2.5 flex-1 min-w-[240px]">
              <div className="relative flex-1 max-w-xs">
                <span className="absolute left-3 top-2.5 text-slate-400">
                  <Icon name="search" size={15} />
                </span>
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Cari No Order, customer, merk..."
                  className="w-full pl-9 pr-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-tosca-600"
                />
              </div>
              <select
                value={statusFilter}
                onChange={(e) => setStatusFilter(e.target.value)}
                className="px-3 py-2 text-xs font-semibold border border-slate-200 rounded-xl bg-white"
              >
                <option value="ALL">Semua Status ({orders.length})</option>
                {STATUS_FLOW.map((st) => (
                  <option key={st} value={st}>{st}</option>
                ))}
              </select>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button
                type="button"
                onClick={handleExportSyncJSON}
                className="px-3 py-2 bg-tosca-50 text-tosca-800 border border-tosca-200 text-xs font-bold rounded-xl hover:bg-tosca-100"
              >
                Export Sync (.JSON)
              </button>
              <button
                type="button"
                onClick={handleExportCSV}
                className="px-3 py-2 bg-slate-100 text-slate-800 text-xs font-bold rounded-xl hover:bg-slate-200"
              >
                Export Excel (.CSV)
              </button>
              <label className="px-3 py-2 bg-slate-900 text-white text-xs font-bold rounded-xl cursor-pointer hover:bg-slate-800">
                Import Data
                <input type="file" accept=".json" onChange={handleImportFile} className="hidden" />
              </label>

              <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                <button
                  onClick={() => setViewMode('kanban')}
                  className={`px-3 py-1 rounded-lg ${viewMode === 'kanban' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}`}
                >
                  Kanban
                </button>
                <button
                  onClick={() => setViewMode('list')}
                  className={`px-3 py-1 rounded-lg ${viewMode === 'list' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}`}
                >
                  List Table
                </button>
              </div>
            </div>
          </div>

          {/* Import Preview Modal */}
          {importPreview && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-xl">
                <h3 className="font-bold text-slate-900 text-base">Konfirmasi Import Sinkronisasi Data</h3>
                <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-xs space-y-1.5">
                  <p>Total Item di File: <strong>{importPreview.orders.length} sepatu</strong></p>
                  <p className="text-tosca-700">Order Baru Terdeteksi: <strong>+{importPreview.newCount} item</strong></p>
                  <p className="text-amber-700">Perubahan Status: <strong>{importPreview.statusChangedCount} item</strong></p>
                </div>
                <div className="grid grid-cols-2 gap-2.5">
                  <button
                    onClick={() => {
                      onImportData(importPreview, 'merge');
                      setImportPreview(null);
                    }}
                    className="py-2.5 bg-tosca-600 text-white font-bold text-xs rounded-xl"
                  >
                    Gabung &amp; Update (Merge)
                  </button>
                  <button
                    onClick={() => {
                      onImportData(importPreview, 'replace');
                      setImportPreview(null);
                    }}
                    className="py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl"
                  >
                    Timpa Semua (Replace)
                  </button>
                </div>
                <button
                  onClick={() => setImportPreview(null)}
                  className="w-full py-2 text-xs font-semibold text-slate-500 hover:text-slate-800"
                >
                  Batal
                </button>
              </div>
            </div>
          )}

          {/* Kanban View */}
          {viewMode === 'kanban' ? (
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-6 gap-4">
              {STATUS_FLOW.map((stage) => {
                const stageOrders = visibleOrders.filter((o) => o.status === stage);
                return (
                  <div
                    key={stage}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={(e) => {
                      const droppedId = e.dataTransfer.getData('text/plain');
                      if (droppedId) onSetStatus(droppedId, stage);
                    }}
                    className="bg-slate-100/80 p-3 rounded-2xl border border-slate-200/70 flex flex-col max-h-[75vh]"
                  >
                    <div className="flex items-center justify-between mb-3 px-1">
                      <h4 className="font-bold text-slate-800 text-xs">{stage}</h4>
                      <span className="px-2 py-0.5 bg-white text-slate-800 font-extrabold text-[11px] rounded-full shadow-2xs">
                        {stageOrders.length}
                      </span>
                    </div>
                    <div className="space-y-2.5 overflow-y-auto pr-1">
                      {stageOrders.slice(0, 25).map((ord) => {
                        const overdue = isOrderOverdue(ord);
                        return (
                          <div
                            key={ord.id}
                            draggable
                            onDragStart={(e) => e.dataTransfer.setData('text/plain', ord.id)}
                            className={`bg-white p-3 rounded-xl border shadow-2xs space-y-2 cursor-grab active:cursor-grabbing ${
                              overdue ? 'border-rose-300 bg-rose-50/40' : 'border-slate-200/80'
                            }`}
                          >
                            <div className="flex items-center justify-between text-[10px]">
                              <span className="font-mono font-bold text-slate-500">{ord.id}</span>
                              {overdue && <span className="px-1.5 py-0.5 bg-rose-600 text-white font-bold rounded">OVERDUE</span>}
                            </div>
                            <div>
                              <p className="font-bold text-slate-900 text-xs leading-snug">{ord.shoeBrand}</p>
                              <p className="text-[11px] text-slate-600">{ord.customerName}</p>
                              <p className="text-[10px] font-semibold text-tosca-700 mt-0.5">{(ord.services || []).join(', ')}</p>
                            </div>
                            {ord.afterPhoto && (
                              <img src={ord.afterPhoto} alt="After QC" className="w-full h-20 object-cover rounded-lg border border-slate-200" />
                            )}
                            <div className="flex items-center justify-between pt-1.5 border-t border-slate-100 gap-1">
                              <label className="text-[10px] font-semibold text-slate-500 hover:text-tosca-700 cursor-pointer">
                                {ord.afterPhoto ? 'Ganti Foto' : '+ Foto QC'}
                                <input
                                  type="file"
                                  accept="image/*"
                                  className="hidden"
                                  onChange={(e) => {
                                    const f = e.target.files?.[0];
                                    if (!f) return;
                                    const r = new FileReader();
                                    r.onload = () => onAttachAfterPhoto(ord.id, r.result);
                                    r.readAsDataURL(f);
                                  }}
                                />
                              </label>
                              {ord.status !== 'Diambil' ? (
                                <button
                                  onClick={() => onAdvanceStatus(ord.id)}
                                  className="px-2.5 py-1 bg-slate-900 text-white font-bold text-[10px] rounded-lg hover:bg-tosca-600"
                                >
                                  Lanjut →
                                </button>
                              ) : (
                                <span className="text-[10px] font-bold text-emerald-600">Selesai ✓</span>
                              )}
                            </div>
                          </div>
                        );
                      })}
                      {stageOrders.length > 25 && (
                        <p className="text-center text-[11px] text-slate-500 py-1">
                          +{stageOrders.length - 25} item lainnya (gunakan filter/pencarian)
                        </p>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            /* List Table View */
            <div className="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="border-b border-slate-100 text-[11px] text-slate-400 uppercase">
                    <th className="py-3 px-4">No Order</th>
                    <th className="py-3 px-3">Tanggal</th>
                    <th className="py-3 px-3">Customer</th>
                    <th className="py-3 px-3">Sepatu &amp; Layanan</th>
                    <th className="py-3 px-3">Status</th>
                    <th className="py-3 px-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {visibleOrders.map((ord) => (
                    <tr key={ord.id} className="hover:bg-slate-50/70">
                      <td className="py-3 px-4 font-mono font-bold text-slate-900">{ord.id}</td>
                      <td className="py-3 px-3 text-slate-600">{ord.dateIn}</td>
                      <td className="py-3 px-3 font-bold text-slate-900">{ord.customerName}</td>
                      <td className="py-3 px-3">
                        <p className="font-bold text-slate-900">{ord.shoeBrand}</p>
                        <p className="text-[11px] text-tosca-600">{(ord.services || []).join(', ')}</p>
                      </td>
                      <td className="py-3 px-3">
                        <span className="px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-100 text-slate-800">
                          {ord.status}
                        </span>
                      </td>
                      <td className="py-3 px-4 text-right">
                        {ord.status !== 'Diambil' ? (
                          <button
                            onClick={() => onAdvanceStatus(ord.id)}
                            className="px-3 py-1 bg-tosca-600 text-white font-bold text-[11px] rounded-lg"
                          >
                            Majukan Status
                          </button>
                        ) : (
                          <span className="font-bold text-emerald-600">Selesai ✓</span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 6. HALAMAN CUSTOMER & LOYALTY (10X CUCI GRATIS 1X)
    // =========================================================================
    const CustomersPage = ({ customers, orders, selectedBranch }) => {
      const [search, setSearch] = useState('');
      const [selectedCust, setSelectedCust] = useState(null);

      const list = useMemo(() => {
        return customers.filter((c) => {
          if (selectedBranch !== 'ALL' && c.branchId !== selectedBranch) return false;
          if (search.trim()) {
            const q = search.toLowerCase();
            return (c.name || '').toLowerCase().includes(q) || (c.phone || '').includes(q);
          }
          return true;
        });
      }, [customers, selectedBranch, search]);

      const custOrders = useMemo(() => {
        if (!selectedCust) return [];
        return orders.filter((o) => (o.customerName || '').toLowerCase() === selectedCust.name.toLowerCase());
      }, [selectedCust, orders]);

      return (
        <div className="space-y-5">
          <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div>
              <h3 className="font-bold text-slate-900 text-base">Database Member &amp; Program Loyalty</h3>
              <p className="text-xs text-slate-500">Setiap 10x cuci otomatis mendapatkan reward 1x Fast Clean Gratis</p>
            </div>
            <input
              type="text"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Cari nama / nomor WA member..."
              className="px-3.5 py-2 text-xs border border-slate-200 rounded-xl w-full sm:w-64"
            />
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            {list.map((c) => {
              const mod = (c.totalWashes || 0) % 10;
              const progress = mod === 0 && c.totalWashes > 0 ? 10 : mod;
              const freeReady = mod === 0 && c.totalWashes > 0;
              return (
                <div key={c.id} className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs space-y-3">
                  <div className="flex items-start justify-between">
                    <div>
                      <h4 className="font-bold text-slate-900 text-sm">{c.name}</h4>
                      <p className="text-xs text-slate-500">{c.phone} • Terakhir: {c.lastWash}</p>
                    </div>
                    <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${
                      c.tier === 'VIP' ? 'bg-slate-900 text-tosca-300' :
                      c.tier === 'Gold' ? 'bg-amber-100 text-amber-800' :
                      c.tier === 'Silver' ? 'bg-slate-200 text-slate-800' : 'bg-slate-100 text-slate-600'
                    }`}>
                      {c.tier}
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-2 bg-slate-50 p-2.5 rounded-xl text-xs">
                    <div>
                      <p className="text-[10px] text-slate-500">Total Cuci</p>
                      <p className="font-extrabold text-slate-900">{c.totalWashes} Pasang</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-500">Total Belanja</p>
                      <p className="font-extrabold text-tosca-700">{formatRupiah(c.totalSpend)}</p>
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between text-[11px] font-semibold mb-1">
                      <span className="text-slate-600">Loyalty Stamp ({progress}/10)</span>
                      <span className="text-tosca-700">{freeReady ? 'Gratis 1x Siap Klaim!' : `${10 - progress}x lagi gratis`}</span>
                    </div>
                    <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
                      <div style={{ width: `${progress * 10}%` }} className="h-full bg-tosca-600 rounded-full" />
                    </div>
                  </div>

                  <div className="flex gap-2 pt-1">
                    <button
                      onClick={() => setSelectedCust(c)}
                      className="flex-1 py-2 bg-slate-900 text-white text-xs font-bold rounded-xl hover:bg-slate-800"
                    >
                      Riwayat Sepatu ({c.totalWashes})
                    </button>
                    <button
                      onClick={() => openWhatsAppMessage(c.phone, `Halo ${c.name}, terima kasih sudah menjadi member ${c.tier} di SPATWO — Fresh Step Daily!`)}
                      className="px-3.5 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold rounded-xl"
                    >
                      WA
                    </button>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Order History Modal */}
          {selectedCust && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-5 space-y-4 max-h-[80vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <h4 className="font-bold text-slate-900 text-base">Riwayat Cuci: {selectedCust.name}</h4>
                    <p className="text-xs text-slate-500">{selectedCust.phone} • Tier {selectedCust.tier}</p>
                  </div>
                  <button onClick={() => setSelectedCust(null)} className="p-1.5 rounded-lg hover:bg-slate-100">
                    <Icon name="x" size={18} />
                  </button>
                </div>
                <div className="overflow-y-auto space-y-2 flex-1">
                  {custOrders.map((ord) => (
                    <div key={ord.id} className="p-3 rounded-xl bg-slate-50 border border-slate-200/70 flex items-center justify-between text-xs">
                      <div>
                        <p className="font-mono font-bold text-slate-500 text-[10px]">{ord.id} • {ord.dateIn}</p>
                        <p className="font-bold text-slate-900">{ord.shoeBrand}</p>
                        <p className="text-[11px] text-tosca-700">{(ord.services || []).join(', ')}</p>
                      </div>
                      <span className="font-extrabold text-slate-900">{formatRupiah(ord.total)}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 7. HALAMAN KEUANGAN & LABA RUGI
    // =========================================================================
    const FinancePage = ({ finance, branches, selectedBranch, dateRange, onAddExpense, addToast }) => {
      const [desc, setDesc] = useState('');
      const [category, setCategory] = useState('Beli Bahan');
      const [amount, setAmount] = useState('');
      const [branchId, setBranchId] = useState(branches[0]?.id || 'BR-JKT-SEL');

      const filtered = useMemo(() => {
        return finance.filter((f) => {
          if (selectedBranch !== 'ALL' && f.branchId !== selectedBranch) return false;
          if (dateRange.start && f.date < dateRange.start) return false;
          if (dateRange.end && f.date > dateRange.end) return false;
          return true;
        });
      }, [finance, selectedBranch, dateRange]);

      const summary = useMemo(() => {
        const income = filtered.filter((f) => f.type === 'INCOME').reduce((s, f) => s + (Number(f.amount) || 0), 0);
        const expense = filtered.filter((f) => f.type === 'EXPENSE').reduce((s, f) => s + (Number(f.amount) || 0), 0);
        return { income, expense, net: income - expense };
      }, [filtered]);

      const handleCreateExpense = (e) => {
        e.preventDefault();
        if (!desc.trim() || !amount) return;
        onAddExpense({
          id: `FIN-EXP-${Date.now()}`,
          date: TODAY_STR,
          type: 'EXPENSE',
          category,
          description: desc.trim(),
          branchId,
          amount: Number(amount),
        });
        setDesc('');
        setAmount('');
      };

      const handleExportFinanceCSV = () => {
        const headers = ['Tanggal', 'Tipe', 'Kategori', 'Keterangan', 'Nominal'];
        const rows = filtered.map((f) => [f.date, f.type, f.category, `"${f.description}"`, f.amount]);
        const csv = [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SPATWO-Keuangan-${TODAY_STR}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        addToast('Laporan Keuangan Diunduh', 'File Excel CSV berhasil diekspor.');
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
              <p className="text-xs font-semibold text-slate-500">Total Pemasukan</p>
              <p className="font-display font-extrabold text-2xl text-emerald-600 mt-1">{formatRupiah(summary.income)}</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
              <p className="text-xs font-semibold text-slate-500">Total Pengeluaran</p>
              <p className="font-display font-extrabold text-2xl text-rose-600 mt-1">{formatRupiah(summary.expense)}</p>
            </div>
            <div className="bg-slate-900 text-white p-5 rounded-2xl shadow-xs">
              <p className="text-xs font-semibold text-tosca-300">Laba Bersih (Net Profit)</p>
              <p className="font-display font-extrabold text-2xl text-white mt-1">{formatRupiah(summary.net)}</p>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Input Pengeluaran */}
            <form onSubmit={handleCreateExpense} className="lg:col-span-4 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs space-y-3.5 h-fit">
              <h3 className="font-bold text-slate-900 text-base">Catat Pengeluaran Operasional</h3>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Kategori</label>
                <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl">
                  <option>Beli Bahan</option>
                  <option>Gaji Karyawan</option>
                  <option>Listrik &amp; Air</option>
                  <option>Sewa Tempat</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Cabang</label>
                <select value={branchId} onChange={(e) => setBranchId(e.target.value)} className="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl">
                  {branches.map((b) => (
                    <option key={b.id} value={b.id}>{b.name}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Keterangan</label>
                <input
                  type="text"
                  value={desc}
                  onChange={(e) => setDesc(e.target.value)}
                  placeholder="Contoh: Beli Sabun Cleaner 5L"
                  className="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl"
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Nominal (Rp)</label>
                <input
                  type="number"
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  placeholder="150000"
                  className="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl"
